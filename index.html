            renderSpellingChallenge() {
                const container = document.getElementById('rightPanel');
                const activeWords = this.words.filter(w => !w.deleted);
                if (activeWords.length < 2) {
                    container.innerHTML =
                        `<div class="game-container"><div class="empty-review">需要至少2个单词，当前仅 ${activeWords.length} 个</div></div>`;
                    return;
                }
                const state = this.gameStates.spellingChallenge || {};
                if (!state.initialized) {
                    state.questions = [];
                    state.index = 0;
                    state.score = 0;
                    state.total = 10;
                    state.finished = false;
                    state.skipAudio = false;
                    state.playedAudio = false;
                    state.showAnswer = false;
                    state.lastAnswer = '';
                    const pool = [...activeWords];
                    for (let i = 0; i < state.total; i++) {
                        const w = pool[Math.floor(Math.random() * pool.length)];
                        const sense = this.pickSense(w);
                        if (!sense) continue;
                        state.questions.push({
                            word: w.word,
                            wordId: w.id,
                            senseId: sense.id,
                            phonetic: w.phonetic || '',
                            definition: sense.definition || '',
                            example: sense.example || ''
                        });
                    }
                    state.total = state.questions.length;
                    state.initialized = true;
                    this.gameStates.spellingChallenge = state;
                }

                if (state.finished || state.index >= state.total) {
                    const finalScore = state.score;
                    const total = state.total;
                    if (state.pendingTimeout) { clearTimeout(state.pendingTimeout);
                        state.pendingTimeout = null; }
                    container.innerHTML = `
                        <div class="game-container">
                            <div class="game-header">
                                <div class="game-title">✍️ 拼写挑战 <small>结果</small></div>
                                <button class="back-btn" id="spellBackBtn">← 返回</button>
                            </div>
                            <div class="game-result">
                                <div class="big-score">${finalScore} / ${total}</div>
                                <div class="sub">正确率 ${total > 0 ? Math.round(finalScore/total*100) : 0}%</div>
                                <button id="spellRetryBtn">🔄 再来一局</button>
                            </div>
                        </div>
                    `;
                    const backBtn = document.getElementById('spellBackBtn');
                    if (backBtn) backBtn.addEventListener('click', () => this.leaveGame());
                    const retryBtn = document.getElementById('spellRetryBtn');
                    if (retryBtn) retryBtn.addEventListener('click', () => {
                        this.stopGameTimers();
                        delete this.gameStates.spellingChallenge;
                        this.renderSpellingChallenge();
                    });
                    return;
                }

                const q = state.questions[state.index];
                if (!q) { state.finished = true;
                    this.renderSpellingChallenge(); return; }

                if (!state.skipAudio && !state.playedAudio) {
                    this.speakWord(q.word);
                    state.playedAudio = true;
                }

                const handleSubmit = () => {
                    if (state.showAnswer) return;
                    const input = document.getElementById('spellInput');
                    const val = input.value.trim();
                    if (!val) return;
                    const correct = val.toLowerCase() === q.word.toLowerCase();
                    this.recordReview(q.wordId, correct, q.senseId);
                    state.playedAudio = false;
                    if (correct) {
                        state.score++;
                        state.index++;
                        state.showAnswer = false;
                        state.lastAnswer = '';
                        if (state.index >= state.total) state.finished = true;
                        this.renderSpellingChallenge();
                    } else {
                        state.showAnswer = true;
                        state.lastAnswer = q.word;
                        this.renderSpellingChallenge();
                        this.scheduleNext(() => {
                            if (!this.isGameActive('spellingChallenge')) return;
                            state.showAnswer = false;
                            state.lastAnswer = '';
                            state.index++;
                            state.playedAudio = false;
                            if (state.index >= state.total) state.finished = true;
                            this.renderSpellingChallenge();
                        });
                    }
                };

                const toggleAudio = () => {
                    state.skipAudio = !state.skipAudio;
                    state.playedAudio = false;
                    this.renderSpellingChallenge();
                };

                let prompt = '';
                if (!state.skipAudio) {
                    prompt = `🔊 听发音拼写单词 (点击按钮播放)`;
                } else {
                    prompt = `📖 根据释义拼写单词：${this.escapeHtml(q.definition)}`;
                }

                const html = `
                    <div class="game-container">
                        <div class="game-header">
                            <div class="game-title">✍️ 拼写挑战 <small>${state.index+1}/${state.total}</small></div>
                            <button class="back-btn" id="spellBackBtn2">← 返回</button>
                        </div>
                        <div style="text-align:center;padding:8px 0;">
                            ${!state.skipAudio ? `
                                <button class="game-skip-audio" id="spellSkipAudioBtn">🔇 跳过听力，直接看释义</button>
                                <div style="margin-top:12px;">
                                    <button id="spellPlayBtn" style="padding:8px 20px;border-radius:30px;border:none;background:#dbeafe;color:#1d4ed8;font-weight:600;cursor:pointer;">🔊 播放发音</button>
                                </div>
                            ` : `
                                <div style="font-size:18px;font-weight:500;margin-bottom:8px;">${prompt}</div>
                                <button class="game-skip-audio" id="spellUnskipAudioBtn">🔊 恢复听力模式</button>
                            `}
                        </div>
                        <div class="game-input">
                            <input type="text" id="spellInput" placeholder="输入单词..." autofocus ${state.showAnswer ? 'disabled' : ''} />
                            <button id="spellSubmitBtn" ${state.showAnswer ? 'disabled' : ''}>提交</button>
                        </div>
                        ${state.showAnswer ? `<div class="feedback-banner wrong">❌ 正确拼写：<strong>${this.escapeHtml(state.lastAnswer)}</strong>（即将进入下一题）</div>` : ''}
                        <div class="game-status">
                            <span>得分 ${state.score}</span>
                            <span>进度 ${state.index+1}/${state.total}</span>
                        </div>
                    </div>
                `;
                container.innerHTML = html;

                const backBtn = document.getElementById('spellBackBtn2');
                if (backBtn) backBtn.addEventListener('click', () => this.leaveGame());

                if (!state.skipAudio) {
                    const skipBtn = document.getElementById('spellSkipAudioBtn');
                    if (skipBtn) skipBtn.addEventListener('click', toggleAudio);
                    const playBtn = document.getElementById('spellPlayBtn');
                    if (playBtn) playBtn.addEventListener('click', () => {
                        this.speakWord(q.word);
                    });
                } else {
                    const unskipBtn = document.getElementById('spellUnskipAudioBtn');
                    if (unskipBtn) unskipBtn.addEventListener('click', toggleAudio);
                }

                const input = document.getElementById('spellInput');
                const submitBtn = document.getElementById('spellSubmitBtn');
                if (input) {
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') handleSubmit();
                    });
                    setTimeout(() => {
                        if (!state.showAnswer) input.focus();
                    }, 100);
                }
                if (submitBtn) submitBtn.addEventListener('click', handleSubmit);
            },

            // ============================================================
            //  单词射手 (Word Shooter)
            // ============================================================
            renderWordShooter() {
                const container = document.getElementById('rightPanel');
                const activeWords = this.words.filter(w => !w.deleted);
                if (activeWords.length < 4) {
                    container.innerHTML =
                        `<div class="game-container"><div class="empty-review">需要至少4个单词，当前仅 ${activeWords.length} 个</div></div>`;
                    return;
                }
                const state = this.gameStates.wordShooter || {};
                if (!state.initialized) {
                    state.questions = [];
                    state.index = 0;
                    state.score = 0;
                    state.total = 10;
                    state.finished = false;
                    state.timer = 10;
                    state.timerId = null;
                    state.pendingTimeout = null;
                    state.showAnswer = false;
                    state.correctAnswer = '';
                    const pool = [...activeWords];
                    for (let i = 0; i < state.total; i++) {
                        const w = pool[Math.floor(Math.random() * pool.length)];
                        const sense = this.pickSense(w);
                        if (!sense) continue;
                        const correctDef = sense.definition;
                        let distractors = [];
                        const others = activeWords.filter(ow => ow.id !== w.id);
                        const shuffledOthers = others.sort(() => Math.random() - 0.5);
                        for (const o of shuffledOthers) {
                            const os = o.senses[0];
                            if (os && os.definition !== correctDef && !distractors.includes(os.definition)) {
                                distractors.push(os.definition);
                            }
                            if (distractors.length >= 3) break;
                        }
                        while (distractors.length < 3) distractors.push('???');
                        const options = [correctDef, ...distractors.slice(0, 3)];
                        for (let j = options.length - 1; j > 0; j--) {
                            const r = Math.floor(Math.random() * (j + 1));
                            [options[j], options[r]] = [options[r], options[j]];
                        }
                        state.questions.push({
                            word: w.word,
                            wordId: w.id,
                            senseId: sense.id,
                            correctDef: correctDef,
                            options: options
                        });
                    }
                    state.total = state.questions.length;
                    state.initialized = true;
                    state.timer = 10;
                    state.showAnswer = false;
                    state.correctAnswer = '';
                    if (state.timerId) clearInterval(state.timerId);
                    state.timerId = setInterval(() => {
                        if (!this.isGameActive('wordShooter')) {
                            clearInterval(state.timerId);
                            state.timerId = null;
                            return;
                        }
                        if (state.finished || state.showAnswer) return;
                        state.timer--;
                        if (state.timer <= 0) {
                            state.timer = 0;
                            const cur = state.questions[state.index];
                            if (!cur) {
                                state.finished = true;
                                this.renderWordShooter();
                                return;
                            }
                            state.showAnswer = true;
                            state.correctAnswer = cur.correctDef;
                            this.recordReview(cur.wordId, false, cur.senseId);
                            this.renderWordShooter();
                            this.scheduleNext(() => {
                                if (!this.isGameActive('wordShooter')) return;
                                state.showAnswer = false;
                                state.correctAnswer = '';
                                state.index++;
                                state.timer = 10;
                                if (state.index >= state.total) state.finished = true;
                                this.renderWordShooter();
                            });
                        } else {
                            this.renderWordShooter();
                        }
                    }, 1000);
                    this.gameStates.wordShooter = state;
                }

                if (state.finished || state.index >= state.total) {
                    const finalScore = state.score;
                    const total = state.total;
                    if (state.timerId) { clearInterval(state.timerId);
                        state.timerId = null; }
                    if (state.pendingTimeout) { clearTimeout(state.pendingTimeout);
                        state.pendingTimeout = null; }
                    container.innerHTML = `
                        <div class="game-container">
                            <div class="game-header">
                                <div class="game-title">🎯 单词射手 <small>结果</small></div>
                                <button class="back-btn" id="shooterBackBtn">← 返回</button>
                            </div>
                            <div class="game-result">
                                <div class="big-score">${finalScore} / ${total}</div>
                                <div class="sub">正确率 ${total > 0 ? Math.round(finalScore/total*100) : 0}%</div>
                                <button id="shooterRetryBtn">🔄 再来一局</button>
                            </div>
                        </div>
                    `;
                    const backBtn = document.getElementById('shooterBackBtn');
                    if (backBtn) backBtn.addEventListener('click', () => this.leaveGame());
                    const retryBtn = document.getElementById('shooterRetryBtn');
                    if (retryBtn) retryBtn.addEventListener('click', () => {
                        this.stopGameTimers();
                        delete this.gameStates.wordShooter;
                        this.renderWordShooter();
                    });
                    return;
                }

                const q = state.questions[state.index];
                if (!q) { state.finished = true;
                    this.renderWordShooter(); return; }

                const handleChoice = (def) => {
                    if (state.finished || state.showAnswer) return;
                    const correct = def === q.correctDef;
                    this.recordReview(q.wordId, correct, q.senseId);
                    if (correct) {
                        state.score++;
                        state.index++;
                        state.timer = 10;
                        if (state.index >= state.total) state.finished = true;
                        this.renderWordShooter();
                    } else {
                        state.showAnswer = true;
                        state.correctAnswer = q.correctDef;
                        this.renderWordShooter();
                        this.scheduleNext(() => {
                            if (!this.isGameActive('wordShooter')) return;
                            state.showAnswer = false;
                            state.correctAnswer = '';
                            state.index++;
                            state.timer = 10;
                            if (state.index >= state.total) state.finished = true;
                            this.renderWordShooter();
                        });
                    }
                };

                let feedbackHtml = '';
                if (state.showAnswer) {
                    feedbackHtml = `<div class="feedback-banner wrong">✅ 正确答案：${this.escapeHtml(state.correctAnswer)}</div>`;
                }

                const html = `
                    <div class="game-container">
                        <div class="game-header">
                            <div class="game-title">🎯 单词射手 <small>选择正确释义</small></div>
                            <button class="back-btn" id="shooterBackBtn2">← 返回</button>
                        </div>
                        <div class="game-question">${this.escapeHtml(q.word)}</div>
                        ${feedbackHtml}
                        <div class="game-options" style="max-width:500px;">
                            ${q.options.map(opt => {
                                let cls = '';
                                if (state.showAnswer) {
                                    if (opt === q.correctDef) cls = 'correct-answer';
                                    else cls = 'wrong-answer';
                                }
                                return `<button class="shooter-option ${cls}" data-def="${this.escapeHtml(opt)}" ${state.showAnswer ? 'disabled' : ''}>${this.escapeHtml(opt)}</button>`;
                            }).join('')}
                        </div>
                        <div class="game-status">
                            <span>进度 ${state.index+1}/${state.total}</span>
                            <span class="score">得分 ${state.score}</span>
                            <span class="timer">本题 ⏱️ ${state.timer}s</span>
                        </div>
                    </div>
                `;
                container.innerHTML = html;

                const backBtn = document.getElementById('shooterBackBtn2');
                if (backBtn) backBtn.addEventListener('click', () => this.leaveGame());
                if (!state.showAnswer) {
                    container.querySelectorAll('.shooter-option').forEach(btn => {
                        btn.addEventListener('click', () => {
                            handleChoice(btn.dataset.def);
                        });
                    });
                }
            },

            // ============================================================
            //  消消乐 (Word Match)
            // ============================================================
            renderWordMatch() {
                const container = document.getElementById('rightPanel');
                const activeWords = this.words.filter(w => !w.deleted);
                if (activeWords.length < 4) {
                    container.innerHTML =
                        `<div class="game-container"><div class="empty-review">需要至少4个单词，当前仅 ${activeWords.length} 个</div></div>`;
                    return;
                }
                const state = this.gameStates.wordMatch || {};
                if (!state.initialized) {
                    const pool = [...activeWords];
                    const selected = [];
                    for (let i = 0; i < 6; i++) {
                        if (pool.length === 0) break;
                        const idx = Math.floor(Math.random() * pool.length);
                        selected.push(pool.splice(idx, 1)[0]);
                    }
                    if (selected.length < 2) {
                        container.innerHTML =
                            `<div class="game-container"><div class="empty-review">单词不足，请添加更多单词</div></div>`;
                        return;
                    }
                    const cards = [];
                    selected.forEach(w => {
                        const sense = this.pickSense(w);
                        if (sense) {
                            cards.push({ type: 'word', text: w.word, pairId: w.id, senseId: sense.id });
                            cards.push({ type: 'def', text: sense.definition, pairId: w.id, senseId: sense.id });
                        }
                    });
                    for (let i = cards.length - 1; i > 0; i--) {
                        const r = Math.floor(Math.random() * (i + 1));
                        [cards[i], cards[r]] = [cards[r], cards[i]];
                    }
                    if (cards.length < 2) {
                        container.innerHTML =
                            `<div class="game-container"><div class="empty-review">可用释义不足，请补充单词释义</div></div>`;
                        state.initialized = false;
                        return;
                    }
                    state.cards = cards;
                    state.selectedIndex = null;
                    state.matchedPairs = new Set();
                    state.finished = false;
                    state.score = 0;
                    state.totalPairs = cards.length / 2;
                    state.initialized = true;
                    this.gameStates.wordMatch = state;
                }

                if (state.finished || state.matchedPairs.size >= state.totalPairs) {
                    const total = state.totalPairs;
                    const matched = state.matchedPairs.size;
                    container.innerHTML = `
                        <div class="game-container">
                            <div class="game-header">
                                <div class="game-title">🧩 消消乐 <small>${matched === total ? '🎉 全部消除！' : '完成'}</small></div>
                                <button class="back-btn" id="matchBackBtn">← 返回</button>
                            </div>
                            <div class="game-result">
                                <div class="big-score">${matched} / ${total}</div>
                                <div class="sub">${matched === total ? '完美通关！' : '继续加油！'}</div>
                                <button id="matchRetryBtn">🔄 再来一局</button>
                            </div>
                        </div>
                    `;
                    const backBtn = document.getElementById('matchBackBtn');
                    if (backBtn) backBtn.addEventListener('click', () => this.leaveGame());
                    const retryBtn = document.getElementById('matchRetryBtn');
                    if (retryBtn) retryBtn.addEventListener('click', () => {
                        this.stopGameTimers();
                        delete this.gameStates.wordMatch;
                        this.renderWordMatch();
                    });
                    return;
                }

                const cards = state.cards;
                const matched = state.matchedPairs;
                const selectedIdx = state.selectedIndex;

                const handleCardClick = (idx) => {
                    if (state.finished) return;
                    const card = cards[idx];
                    if (matched.has(card.pairId)) return;
                    if (selectedIdx === idx) {
                        state.selectedIndex = null;
                        this.renderWordMatch();
                        return;
                    }
                    if (selectedIdx === null) {
                        state.selectedIndex = idx;
                        this.renderWordMatch();
                        return;
                    }
                    const firstCard = cards[selectedIdx];
                    if (firstCard.pairId === card.pairId) {
                        matched.add(card.pairId);
                        state.selectedIndex = null;
                        state.score++;
                        this.recordReview(card.pairId, true, card.senseId);
                        if (matched.size >= state.totalPairs) state.finished = true;
                        this.renderWordMatch();
                    } else {
                        state.selectedIndex = null;
                        this.recordReview(firstCard.pairId, false, firstCard.senseId);
                        const tempIdx = idx;
                        this.renderWordMatch();
                        const allCards = container.querySelectorAll('.match-card');
                        if (allCards[tempIdx]) allCards[tempIdx].classList.add('wrong-match');
                        if (allCards[selectedIdx]) allCards[selectedIdx].classList.add('wrong-match');
                        state.pendingTimeout = setTimeout(() => {
                            if (!this.isGameActive('wordMatch')) return;
                            this.renderWordMatch();
                        }, 400);
                    }
                };

                let gridHtml = '';
                cards.forEach((card, idx) => {
                    const isMatched = matched.has(card.pairId);
                    const isSelected = (selectedIdx === idx);
                    let cls = 'match-card';
                    if (isMatched) cls += ' matched';
                    if (isSelected) cls += ' selected';
                    let displayText = card.text;
                    if (card.type === 'def') {
                        displayText = card.text.length > 30 ? card.text.slice(0, 28) + '…' : card.text;
                    }
                    gridHtml += `
                        <div class="${cls}" data-index="${idx}">${this.escapeHtml(displayText)}</div>
                    `;
                });

                const html = `
                    <div class="game-container">
                        <div class="game-header">
                            <div class="game-title">🧩 消消乐 <small>匹配单词与释义</small></div>
                            <button class="back-btn" id="matchBackBtn2">← 返回</button>
                        </div>
                        <div class="match-grid" id="matchGrid">
                            ${gridHtml}
                        </div>
                        <div class="game-status">
                            <span>已配对 ${matched.size}/${state.totalPairs}</span>
                            <span>得分 ${state.score}</span>
                        </div>
                    </div>
                `;
                container.innerHTML = html;

                const backBtn = document.getElementById('matchBackBtn2');
                if (backBtn) backBtn.addEventListener('click', () => this.leaveGame());

                const grid = document.getElementById('matchGrid');
                if (grid) {
                    grid.querySelectorAll('.match-card').forEach(el => {
                        const idx = parseInt(el.dataset.index);
                        el.addEventListener('click', () => handleCardClick(idx));
                    });
                }
            },

            // ============================================================
            //  创意造句 (Creative Writing)
            // ============================================================
            renderCreativeWriting() {
                const container = document.getElementById('rightPanel');
                const activeWords = this.words.filter(w => !w.deleted);
                if (activeWords.length < 8) {
                    container.innerHTML =
                        `<div class="game-container"><div class="empty-review">需要至少8个单词，当前仅 ${activeWords.length} 个，请添加更多单词。</div></div>`;
                    return;
                }
                const state = this.gameStates.creativeWriting || {};
                if (!state.initialized) {
                    // 随机选择8-10个单词
                    const count = Math.min(10, Math.max(8, activeWords.length));
                    const shuffled = [...activeWords].sort(() => Math.random() - 0.5);
                    const selected = shuffled.slice(0, count);
                    state.words = selected.map(w => ({
                        id: w.id,
                        word: w.word,
                        definition: (this.pickSense(w) || {}).definition || ''
                    }));
                    state.used = new Set();
                    state.submitted = false;
                    state.feedback = '';
                    state.input = '';
                    state.initialized = true;
                    this.gameStates.creativeWriting = state;
                }

                const handleSubmit = () => {
                    if (state.submitted) return;
                    const input = document.getElementById('creativeInput');
                    const text = input.value.trim();
                    if (!text) {
                        state.feedback = '⚠️ 请写一个句子或小故事';
                        this.renderCreativeWriting();
                        return;
                    }
                    state.input = text;
                    state.submitted = true;
                    // 检查使用了哪些单词
                    const words = state.words.map(w => w.word.toLowerCase());
                    const tokens = text.toLowerCase().split(/[\s,;.!?()"'\/\\\[\]{}|<>@#$%^&*~`+=\-–—，。；：！？、]+/).filter(t => t.length >
                        0);
                    const usedWords = new Set();
                    words.forEach(w => {
                        if (tokens.includes(w)) usedWords.add(w);
                    });
                    state.used = usedWords;
                    state.words.forEach(sw => {
                        if (usedWords.has(sw.word.toLowerCase())) this.recordReview(sw.id, true);
                    });
                    const total = words.length;
                    const usedCount = usedWords.size;
                    const missing = words.filter(w => !usedWords.has(w));
                    if (usedCount === total) {
                        state.feedback = `🎉 完美！你使用了所有 ${total} 个单词！句子/故事非常棒！`;
                    } else {
                        state.feedback =
                        `✅ 你使用了 ${usedCount}/${total} 个单词。未使用：${missing.join('、')}。继续加油！`;
                    }
                    this.renderCreativeWriting();
                };

                const resetGame = () => {
                    this.flushReview();
                    delete this.gameStates.creativeWriting;
                    this.renderCreativeWriting();
                };

                const goBack = () => {
                    this.leaveGame();
                };

                const words = state.words;
                const usedSet = state.used;
                const submitted = state.submitted;
                const feedback = state.feedback || '';

                let chipHtml = words.map(w => {
                    const isUsed = usedSet.has(w.word.toLowerCase());
                    return `<span class="word-chip ${isUsed ? 'used' : ''}" title="${this.escapeHtml(w.definition)}">${this.escapeHtml(w.word)}</span>`;
                }).join('');

                let feedbackHtml = '';
                if (submitted) {
                    feedbackHtml = `
                        <div class="creative-feedback">
                            <div>${this.escapeHtml(feedback)}</div>
                            <div style="margin-top:8px;font-size:14px;color:#64748b;">
                                💡 提示：将鼠标悬停在单词上可查看释义。
                            </div>
                        </div>
                    `;
                }

                const html = `
                    <div class="game-container">
                        <div class="game-header">
                            <div class="game-title">✏️ 创意造句 <small>用给出的单词造句或编故事</small></div>
                            <button class="back-btn" id="creativeBackBtn">← 返回</button>
                        </div>
                        <div style="text-align:center;margin-bottom:12px;">
                            <span style="font-size:14px;color:#64748b;">💡 使用下方所有单词（共 ${words.length} 个）</span>
                        </div>
                        <div class="word-chips">
                            ${chipHtml}
                        </div>
                        <div style="max-width:700px;margin:0 auto;">
                            <textarea id="creativeInput" class="creative-textarea" placeholder="在这里写下你的句子或小故事..." ${submitted ? 'disabled' : ''}>${submitted ? this.escapeHtml(state.input) : ''}</textarea>
                            ${!submitted ? `
                                <div style="text-align:right;margin-top:10px;">
                                    <button id="creativeSubmitBtn" style="padding:8px 32px;border:none;border-radius:30px;background:#3b82f6;color:white;font-weight:600;font-size:16px;cursor:pointer;">提交</button>
                                    <button id="creativeResetBtn" style="padding:8px 24px;border:none;border-radius:30px;background:#e2e8f0;color:#475569;font-weight:500;font-size:14px;cursor:pointer;margin-left:8px;">换一批</button>
                                </div>
                            ` : `
                                <div style="text-align:right;margin-top:10px;">
                                    <button id="creativeResetBtn2" style="padding:8px 24px;border:none;border-radius:30px;background:#e2e8f0;color:#475569;font-weight:500;font-size:14px;cursor:pointer;">换一批</button>
                                </div>
                            `}
                            ${feedbackHtml}
                        </div>
                    </div>
                `;
                container.innerHTML = html;

                const backBtn = document.getElementById('creativeBackBtn');
                if (backBtn) backBtn.addEventListener('click', goBack);

                if (!submitted) {
                    const submitBtn = document.getElementById('creativeSubmitBtn');
                    if (submitBtn) submitBtn.addEventListener('click', handleSubmit);
                    const resetBtn = document.getElementById('creativeResetBtn');
                    if (resetBtn) resetBtn.addEventListener('click', resetGame);
                    const input = document.getElementById('creativeInput');
                    if (input) {
                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' && (e.ctrlKey || e.shiftKey)) {
                                e.preventDefault();
                                handleSubmit();
                            }
                        });
                        setTimeout(() => input.focus(), 100);
                    }
                } else {
                    const resetBtn = document.getElementById('creativeResetBtn2');
                    if (resetBtn) resetBtn.addEventListener('click', resetGame);
                }
            },

            // ---- 词典详情 (原有) ----
            renderDictionaryDetail(container) {
                const word = this.words.find(w => w.id === this.currentWordId);
                if (!word) { container.innerHTML = '<div class="detail-placeholder">👆 点击左侧条目查看详情</div>'; return; }
                if (this.currentSenseId === null) { this.renderOverview(container, word); return; }
                let sense = word.senses.find(s => s.id === this.currentSenseId);
                if (!sense && word.senses.length > 0) { sense = word.senses[0];
                    this.currentSenseId = sense.id; }
                if (!sense) { container.innerHTML = '<div class="detail-placeholder">该单词暂无释义，请添加。</div>'; return; }
                this.renderSenseDetail(container, word, sense);
            },

            renderOverview(container, word) {
                const isDeleted = word.deleted === true;
                const wordNotes = word.wordNotes || [];
                const notesHtml = wordNotes.map((n, idx) => {
                    const isPrimary = idx === 0;
                    return `<div class="note-item ${isPrimary ? 'primary' : ''}" data-note-index="${idx}"><div class="note-text" contenteditable="true">${this.escapeHtml(n || '')}</div><div class="note-actions"><button class="delete-word-note" data-index="${idx}" title="删除注释">✕</button></div></div>`;
                }).join('');
                const core = word.core || {};
                const morph = word.morphology || {};
                const etym = word.etymology || {};
                const coreBits = [];
                if (core.feeling) coreBits.push(`<div class="core-feeling">${this.escapeHtml(core.feeling)}</div>`);
                if (core.image) coreBits.push(`<div class="core-image">🖼️ ${this.escapeHtml(core.image)}</div>`);
                if (Array.isArray(core.keywords) && core.keywords.length) {
                    coreBits.push(`<div class="core-keywords">${core.keywords.map(k => `<span>${this.escapeHtml(k)}</span>`).join('')}</div>`);
                }
                if (Array.isArray(core.chain) && core.chain.length) {
                    coreBits.push(`<div class="core-chain">${core.chain.map(n => `<span class="chain-node"><b>${this.escapeHtml(n.label || '')}</b><small>${this.escapeHtml(n.bridge || '')}</small></span>`).join('<span class="chain-arrow">→</span>')}</div>`);
                }
                const coreHtml = coreBits.length ? `<div class="detail-section core-section"><h4>🧭 核心感觉</h4>${coreBits.join('')}</div>` : '';
                const rootBits = [];
                if (Array.isArray(morph.parts) && morph.parts.length) {
                    rootBits.push(`<div class="morph-parts">${morph.parts.map(p => `<span class="morph-part"><b>${this.escapeHtml(p.form || '')}</b> ${this.escapeHtml(p.meaning || '')}</span>`).join('<span class="chain-arrow">+</span>')}</div>`);
                }
                if (morph.literal) rootBits.push(`<div class="morph-literal">字面义：${this.escapeHtml(morph.literal)}</div>`);
                if (Array.isArray(etym.path) && etym.path.length) {
                    rootBits.push(`<div class="etym-path">${etym.path.map(p => `<span>${this.escapeHtml(p.form || '')}<small>${this.escapeHtml(p.language || '')}</small></span>`).join('<span class="chain-arrow">→</span>')}</div>`);
                }
                if (etym.story) rootBits.push(`<div class="etym-story">${this.escapeHtml(etym.story)}</div>`);
                const rootHtml = rootBits.length ? `<div class="detail-section"><h4>🌱 词根与词源</h4>${rootBits.join('')}</div>` : '';
                const wordSynGroups = (word.synonymGroupIds || [])
                    .map(id => (this.extras.synonymGroups || []).find(g => g.id === id))
                    .filter(Boolean);
                const synHtml = wordSynGroups.length ? `<div class="detail-section syn-section"><h4>⚖️ 近义辨析</h4>${wordSynGroups.map(g => {
                    const members = (g.members || []).map(m => `<span class="syn-member"><b>${this.escapeHtml(m.word || '')}</b>${m.nuance ? ` · ${this.escapeHtml(m.nuance)}` : ''}${m.register ? ` <small>${this.escapeHtml(m.register)}</small>` : ''}</span>`).join('');
                    const contrasts = (g.contrasts || []).map(c => `<div class="syn-contrast">${this.escapeHtml(c.a || '')} vs ${this.escapeHtml(c.b || '')}：${this.escapeHtml(c.difference || '')}</div>`).join('');
                    return `<div class="syn-group"><div class="syn-title">${this.escapeHtml(g.name || '近义组')}</div><div class="syn-members">${members}</div>${contrasts}${g.mnemonic ? `<div class="syn-mnemonic">💡 ${this.escapeHtml(g.mnemonic)}</div>` : ''}</div>`;
                }).join('')}</div>` : '';
                const rootFamily = (word.morphology && word.morphology.rootFamilyId)
                    ? (this.extras.rootFamilies || []).find(g => g.id === word.morphology.rootFamilyId) : null;
                const rootFamilyHtml = rootFamily ? `<div class="detail-section"><h4>🌳 同根家族</h4><div class="root-family"><div class="root-family-head"><b>${this.escapeHtml(rootFamily.root || '')}</b> ${this.escapeHtml(rootFamily.meaning || '')}</div><div class="root-family-members">${(rootFamily.members || []).map(m => `<span class="root-member"><b>${this.escapeHtml(m.word || '')}</b>${m.meaning ? ` · ${this.escapeHtml(m.meaning)}` : ''}</span>`).join('')}</div>${rootFamily.mnemonic ? `<div class="syn-mnemonic">💡 ${this.escapeHtml(rootFamily.mnemonic)}</div>` : ''}</div></div>` : '';
                const senseListHtml = word.senses.map((s, idx) => {
                    const tags = [];
                    if (s.tone) tags.push('情感:' + s.tone);
                    if (s.topic) tags.push('主题:' + s.topic);
                    if (s.pos) tags.push('词性:' + s.pos);
                    if (s.level) tags.push('难度:' + s.level);
                    if (s.origin) tags.push('来源:' + s.origin);
                    if (s.formality) tags.push('语体:' + s.formality);
                    if (s.grammar) tags.push('语法:' + s.grammar);
                    const tagHtml = tags.length ? tags.map(t => `<span>${this.escapeHtml(t)}</span>`).join('') : '';
                    const srsP = this.progress.get(this.senseKey(word.id, s.id));
                    const srsText = srsP

            renderStats(container) {
                const activeWords = this.words.filter(w => !w.deleted);
                const totalWords = activeWords.length;
                const totalSenses = activeWords.reduce((acc, w) => acc + w.senses.length, 0);
                const mastered = activeWords.filter(w => w.mastery === 'mastered').length;
                const learning = activeWords.filter(w => w.mastery === 'learning').length;
                const unknown = activeWords.filter(w => w.mastery === 'unknown' || !w.mastery).length;
                const now = Date.now();
                const dueForReview = activeWords.filter(w => (now - w.lastReviewDate) / 86400000 > 2).length;
                const activeSenseKeys = new Set();
                activeWords.forEach(w => (w.senses || []).forEach(s => { if (s) activeSenseKeys.add(this.senseKey(w.id, s.id)); }));
                const dueSenses = [...this.progress.values()].filter(p => (p.dueAt || 0) <= now && activeSenseKeys.has(p.key)).length;
                const learnedSenses = this.progress.size;
                const wrongSenses = [...this.progress.values()].filter(p => p.wrongActive && activeSenseKeys.has(p.key)).length;
                const deletedCount = this.words.filter(w => w.deleted).length;
                const totalReviews = activeWords.reduce((acc, w) => acc + (w.reviewCount || 0), 0);
                const totalCorrect = activeWords.reduce((acc, w) => acc + (w.correctCount || 0), 0);
                const accuracy = totalReviews > 0 ? Math.round(totalCorrect / totalReviews * 100) : 0;
                const coreReady = activeWords.filter(w => w.core && w.core.feeling &&
                    w.core.quality !== 'needs-review').length;
                const synGroupCount = (this.extras.synonymGroups || []).length;
                const rootFamilyCount = (this.extras.rootFamilies || []).length;
                const fields = ['tone', 'topic', 'pos', 'level', 'origin', 'formality', 'grammar'];
                const stats = {};
                fields.forEach(f => stats[f] = {});
                activeWords.forEach(w => {
                    w.senses.forEach(s => {
                        fields.forEach(f => {
                            const val = s[f] ? s[f].trim() : '未标记';
                            if (!stats[f][val]) stats[f][val] = 0;
                            stats[f][val]++;
                        });
                    });
                });
                const dayMs = 86400000;
                const last7days = Array.from({ length: 7 }, (_, i) => { const d = new Date(now - (6 - i) *
                    dayMs); return d.toISOString().slice(0, 10); });
                const dailyCounts = last7days.map(date => activeWords.filter(w => new Date(w.addedDate)
                    .toISOString().slice(0, 10) === date).length);

                    `<h3 style="margin-bottom:20px;">📊 数据统计</h3><div class="stats-grid"><div class="stat-card"><div class="number">${totalWords}</div><div class="label">总单词数（活跃）</div></div><div class="stat-card"><div class="number">${totalSenses}</div><div class="label">总释义数</div></div><div class="stat-card" style="border-color: #6366f1;"><div class="number">${coreReady}</div><div class="label">🧭 核心感觉就绪</div></div><div class="stat-card" style="border-color: #0ea5e9;"><div class="number">${synGroupCount}</div><div class="label">⚖️ 近义组</div></div><div class="stat-card" style="border-color: #22c55e;"><div class="number">${rootFamilyCount}</div><div class="label">🌳 词根家族</div></div><div class="stat-card"><div class="number">${mastered}</div><div class="label">✅ 已掌握</div></div><div class="stat-card"><div class="number">${learning}</div><div class="label">🔄 学习中</div></div><div class="stat-card"><div class="number">${unknown}</div><div class="label">❓ 未标记</div></div><div class="stat-card" style="border-color: #f59e0b;"><div class="number">${dueForReview}</div><div class="label">🔔 待复习</div></div><div class="stat-card" style="border-color: #0ea5e9;"><div class="number">${dueSenses}</div><div class="label">⏰ 到期义项</div></div><div class="stat-card" style="border-color: #14b8a6;"><div class="number">${learnedSenses}</div><div class="label">📚 已学义项</div></div><div class="stat-card" style="border-color: #ef4444;"><div class="number">${wrongSenses}</div><div class="label">❗ 错题义项</div></div><div class="stat-card" style="border-color: #8b5cf6;"><div class="number">${totalReviews}</div><div class="label">🎮 累计复习</div></div><div class="stat-card" style="border-color: #10b981;"><div class="number">${accuracy}%</div><div class="label">🎯 平均正确率</div></div><div class="stat-card" style="border-color: #94a3b8;"><div class="number">${deletedCount}</div><div class="label">♻️ 回收站</div></div></div>`;
                const fieldLabels = { tone: '😊 情感色彩', topic: '📚 主题', pos: '📌 词性', level: '⭐ 难度',
                    origin: '🌍 来源', formality: '📝 语体', grammar: '📖 语法属性' };
                fields.forEach(f => {
                    const data = stats[f];
                    if (Object.keys(data).length > 0) {
                        html += `<div class="stats-category" style="margin-top:12px;"><h4>${fieldLabels[f]}</h4>`;
                        Object.entries(data).sort((a, b) => b[1] - a[1]).forEach(([key, count]) => {
                            html +=
                                `<div class="cat-stat-item"><span class="name">${this.escapeHtml(key)}</span><span class="count">${count}</span></div>`;
                        });
                        html += '</div>';
                    }
                });
                html +=
                    `<div class="stats-category" style="margin-top:16px;"><h4>📈 近7天新增趋势</h4><div style="display:flex; gap:8px; align-items:flex-end; height:120px; padding:12px 0;">${last7days.map((date, i) => { const height = Math.max(10, dailyCounts[i] * 20); return `<div style="flex:1; display:flex; flex-direction:column; align-items:center;"><div style="width:100%; background:#3b82f6; height:${height}px; border-radius:4px 4px 0 0; min-height:8px;"></div><div style="font-size:11px; color:#64748b; margin-top:4px;">${date.slice(5)}</div><div style="font-size:12px; font-weight:600;">${dailyCounts[i]}</div></div>`; }).join('')}</div></div>`;
                container.innerHTML = html;
            },

            softDeleteWord(id) {
                const w = this.words.find(w => w.id === id);
                if (!w) return;
                this.pushUndo('删除单词');
                w.deleted = true;
                this.searchIndex.removeWord(id);
                this.saveData();
                if (this.currentWordId === id) { this.currentWordId = null;
                    this.currentSenseId = null; }
                this.render();
                this.lastDeletedId = id;
                this.showToast(`🗑 已删除 "${w.word}"`, 'info', 4000, () => this.restoreWord(id));
            },
            restoreWord(id) {
                const w = this.words.find(w => w.id === id);
                if (!w) return;
                this.pushUndo('还原单词');
                w.deleted = false;
                this.searchIndex.addWord(w);
                this.saveData();
                if (this.currentMode === 'recycle') this.render();
                else { this.renderList(); if (this.currentWordId === id) this.renderRightPanel(); }
                this.showToast(`↩ 已还原 "${w.word}"`, 'success');
                this.lastDeletedId = null;
            },
            permanentDeleteWord(id) {
                const w = this.words.find(w => w.id === id);
                if (!w) return;
                this.pushUndo('永久删除单词');
                const wordName = w.word;
                this.words = this.words.filter(w => w.id !== id);
                this.searchIndex.removeWord(id);
                this.saveData();
                if (this.currentWordId === id) { this.currentWordId = null;
                    this.currentSenseId = null; }
                this.render();
                this.showToast(`🗑 已永久删除 "${wordName}"`, 'error');
                this.lastDeletedId = null;
            },
            navigateWord(delta) {
                if (this.currentMode === 'recycle') return;
                const displayWords = this.getFilteredWords();
                const sorted = [...displayWords].sort((a, b) => a.word.localeCompare(b.word));
                if (sorted.length === 0) return;
                const idx = sorted.findIndex(w => w.id === this.currentWordId);
                let newIdx = idx === -1 ? 0 : (idx + delta + sorted.length) % sorted.length;
                const w = sorted[newIdx];
                this.currentWordId = w.id;
                this.currentSenseId = this.currentSenseId === null ? null : (w.senses.length > 0 ? w.senses[0].id : null);
                this.renderRightPanel();
                this.renderList();
            },
            speakWord(word) {

                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            },

            async fetchWordData(word) {

                        `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);

                            '❌ 查询失败，请稍后重试', 'error'); return; }
                    const data = await response.json();
                    if (!data || data.length === 0) { this.showToast('❌ 未找到该单词的释义', 'error'); return; }

                    if (meanings && meanings.length > 0) {

                        const example = firstMeaning.definitions[0]?.example || '';

            toggleBatchMode() {

            updateBatchBar() {

            updateBatchInfo() {

                    `📦 回收站：已选择 ${this.selectedWordIds.size} 个单词` :

            batchSelectAll() {
                const displayWords = this.getFilteredWords();
                const allSelected = displayWords.length > 0 && displayWords.every(w => this.selectedWordIds.has(w.id));
                if (allSelected) this.selectedWordIds.clear();
                else displayWords.forEach(w => this.selectedWordIds.add(w.id));

            batchDeleteWords() {
                if (this.selectedWordIds.size === 0) { this.showToast('⚠️ 请先选择要删除的单词', 'error'); return; }
                const ids = new Set(this.selectedWordIds);
                const names = [];
                ids.forEach(id => { const w = this.words.find(w => w.id === id); if (w) names.push(w.word); });
                const suffix = `${names.slice(0, 10).join(', ')}${names.length > 10 ? ' 等...' : ''}`;
                if (this.currentMode === 'recycle') {
                    if (!confirm(`确定永久删除选中的 ${ids.size} 个单词吗？此操作不可恢复！\n\n${suffix}`)) return;
                    this.pushUndo('批量永久删除');
                    this.words = this.words.filter(w => !ids.has(w.id));
                    this.searchIndex.rebuild(this.words);
                    if (this.currentWordId && ids.has(this.currentWordId)) {
                        this.currentWordId = null;
                        this.currentSenseId = null;
                    }
                    this.selectedWordIds.clear();
                    this.saveData();
                    this.render();
                    this.updateBatchInfo();
                    this.showToast(`🗑 已永久删除 ${ids.size} 个单词`, 'error');
                    return;
                }
                if (!confirm(`确定将选中的 ${ids.size} 个单词移入回收站吗？\n\n${suffix}`)) return;
                this.pushUndo('批量删除');
                let count = 0;
                ids.forEach(id => {
                    const w = this.words.find(w => w.id === id);
                    if (w && !w.deleted) { w.deleted = true;
                        count++; }
                });
                this.searchIndex.rebuild(this.words);
                if (this.currentWordId && ids.has(this.currentWordId)) { this.currentWordId = null;
                    this.currentSenseId = null; }
                this.selectedWordIds.clear();
                this.saveData();
                this.render();
                this.updateBatchInfo();
                this.showToast(`🗑 已将 ${count} 个单词移入回收站`, 'info');
            },
            emptyRecycleBin() {
                const recycleWords = this.words.filter(w => w.deleted);
                if (recycleWords.length === 0) { this.showToast('♻️ 回收站已经是空的', 'info'); return; }
                if (!confirm(`确定清空回收站吗？这将永久删除 ${recycleWords.length} 个单词，不可恢复！`)) return;
                this.pushUndo('清空回收站');
                this.words = this.words.filter(w => !w.deleted);
                this.searchIndex.rebuild(this.words);
                this.selectedWordIds.clear();
                this.saveData();
                if (this.currentWordId && !this.words.some(w => w.id === this.currentWordId)) { this.currentWordId = null;
                    this.currentSenseId = null; }
                this.render();
                this.updateBatchInfo();
                this.showToast(`🗑 已清空回收站，永久删除 ${recycleWords.length} 个单词`, 'error');

            askText(title, defaultValue = '') {

                    const titleEl = document.getElementById('textPromptTitle');
                    const input = document.getElementById('textPromptInput');
                    const ok = document.getElementById('textPromptOk');

                    input.value = defaultValue;

                    const close = (value) => {
                        overlay.classList.remove('show');
                        ok.onclick = null;
                        cancel.onclick = null;
                        input.onkeydown = null;
                        overlay.onclick = null;
                        resolve(value);
                    };
                    ok.onclick = () => close(input.value.trim() || null);
                    cancel.onclick = () => close(null);
                    input.onkeydown = (e) => {
                        if (e.key === 'Enter') { e.preventDefault();
                            close(input.value.trim() || null); }
                        if (e.key === 'Escape') { e.preventDefault();
                            close(null); }
                    };
                    overlay.onclick = (e) => { if (e.target === overlay) close(null); };
