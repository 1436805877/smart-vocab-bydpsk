<!DOCTYPE html>
<!--
    智能单词本 v0.3 beta（多词库测试版）
    基于 v2.3.1，但开始按「核心感觉 + 词根演变 + 近义辨析」的学习方式重构。
    0.1 的目标：清理旧功能、收紧复习模式、改善导入导出，并预留 v2 数据结构。
    正式版之前不会使用 1.0。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能单词本 v0.3 beta</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            padding: 20px;
            color: #0f172a;
            min-height: 100vh;
        }
        .app {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 20px 24px 30px;

        .top-bar {

            align-items: center;
            gap: 8px;

            margin-bottom: 16px;

            scrollbar-width: thin;

        }

        .top-bar .version-tag {

            font-weight: 600;
            color: #4f46e5;
            background: #eef2ff;
            border: 1px solid #c7d2fe;

            border-radius: 20px;
            letter-spacing: .02em;

            justify-content: space-between;

            color: #1e40af;

        }
        .top-bar .nav-btn {

            background: transparent;

        }
        .top-bar .tool-btn {

            font-size: 15px;

            color: #0f172a;
        }

            color: #4f46e5;
        }
        .top-bar .tool-btn.import-btn:hover {
            background: #eef2ff;
        }

            align-items: center;

            grid-template-columns: 1fr 1.2fr;
            gap: 28px;
            margin-top: 8px;

                grid-template-columns: 1fr;
                gap: 20px;

            .main.game-active {
                grid-template-columns: 1fr;
            }

            background: #fafcff;
            border-radius: 16px;
            border: 1px solid #e9edf2;
            display: flex;
            flex-direction: row;
            min-height: 0;
            overflow: hidden;

        }

            border-right: 1px solid #e9edf2;

            align-items: center;
            padding: 6px 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;

        }
        .alpha-nav button:hover {

        }

            cursor: not-allowed;

        }
        .left-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            border-bottom: 1px solid #e9edf2;

            gap: 6px;

        .panel-header .mode-title {

            font-size: 15px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-header .mode-title select {
            padding: 2px 8px;
            border-radius: 30px;
            border: 1px solid #d1d5db;
            font-size: 13px;
            background: white;
            outline: none;
        }
        .panel-header .mode-title select:focus {
            border-color: #3b82f6;
        }
        .panel-header .action-btn {
            background: #eef2ff;
            border: none;
            color: #4f46e5;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.15s;
        }
        .panel-header .action-btn:hover {
            background: #dbeafe;
        }
        .panel-header .action-btn.add-word {
            background: #d1fae5;
            color: #065f46;
        }
        .panel-header .action-btn.add-word:hover {
            background: #a7f3d0;
        }
        .add-word-form {
            display: none;
            padding: 16px 18px 18px;
            background: #f8fafc;
            border-bottom: 2px solid #d1fae5;
            border-radius: 0 0 12px 12px;
            flex-shrink: 0;
            animation: slideDown 0.25s ease;
        }
        .add-word-form.open {
            display: block;
        }
        @keyframes slideDown {
            0% {
                opacity: 0;
                transform: translateY(-8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .add-word-form .form-title {
            font-weight: 600;
            font-size: 16px;
            color: #0f172a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .add-word-form .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
        }
        .add-word-form .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .add-word-form .form-group.full-width {
            grid-column: 1/-1;
        }
        .add-word-form .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
        }
        .add-word-form .form-group label .required {
            color: #ef4444;
            margin-left: 2px;
        }
        .add-word-form .form-group input,
        .add-word-form .form-group textarea {
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            transition: 0.15s;
            outline: none;
            width: 100%;
        }
        .add-word-form .form-group input:focus,
        .add-word-form .form-group textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .add-word-form .form-group textarea {
            resize: vertical;
            min-height: 44px;
            max-height: 120px;
        }
        .add-word-form .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            justify-content: flex-end;
            grid-column: 1/-1;
        }
        .add-word-form .form-actions button {
            padding: 6px 28px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
        }
        .add-word-form .form-actions .save-btn {
            background: #22c55e;
            color: white;
        }
        .add-word-form .form-actions .save-btn:hover {
            background: #16a34a;
        }
        .add-word-form .form-actions .cancel-btn {
            background: #e2e8f0;
            color: #475569;
        }
        .add-word-form .form-actions .cancel-btn:hover {
            background: #cbd5e1;
        }
        .add-word-form .form-error {
            color: #ef4444;
            font-size: 13px;
            margin-top: 4px;
            grid-column: 1/-1;
            display: none;
        }
        .add-word-form .form-error.show {
            display: block;
        }
        .add-word-form .fetch-btn {
            background: #eef2ff;
            color: #4f46e5;
            border: none;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.15s;
            margin-left: 8px;
        }
        .add-word-form .fetch-btn:hover {
            background: #dbeafe;
        }
        .add-word-form .fetch-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .add-word-form .word-input-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .add-word-form .word-input-wrapper input {
            flex: 1;
        }
        @media(max-width:600px) {
            .add-word-form .form-grid {
                grid-template-columns: 1fr;
            }
            .add-word-form .form-group.full-width {
                grid-column: 1;
            }
            .add-word-form .form-actions {
                grid-column: 1;
            }
        }
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0 12px;
            position: relative;
            content-visibility: auto;
        }
        .list-group {
            margin-bottom: 12px;
        }
        .list-group .group-title {
            font-weight: 600;
            font-size: 14px;
            color: #1e293b;
            padding: 4px 18px;
            background: #f1f5f9;
            border-bottom: 1px solid #e9edf2;
            display: flex;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .list-group .group-title .count {
            font-weight: 400;
            color: #64748b;
            font-size: 13px;
        }
        .list-item {
            padding: 6px 18px;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            flex-direction: column;
            gap: 2px;

            content-visibility: auto;

        }
        .list-item:hover {

        }
        .list-item.active {

            border-left-color: #3b82f6;
        }
        .list-item .word-row {

        }
        .list-item .word-text {

            white-space: nowrap;
        }
        .list-item .mastery-badge {
            font-size: 12px;
            padding: 0 10px;
            border-radius: 20px;
            background: #e2e8f0;
            color: #475569;

        }
        .list-item .mastery-badge.mastered {
            background: #bbf7d0;

        }
        .list-item .mastery-badge.learning {

        .list-item .review-reminder {

        }
        .list-item.sense-item .word-text {

        .list-item.word-item {

        .list-item.word-item.active {

        }

        }
        .list-item.deleted-item .word-text {

        }
        .recycle-actions {
            display: flex;

        }

            border: 1px solid #e9edf2;

            overflow-y: auto;
        }

        .detail-word .word-header {

        .core-recall-phonetic {

        .core-recall-prompt {

        .core-recall-reveal-wrap button {

            font-size: 15px;

        }
        .core-recall-reveal-wrap button:hover {

        }
        .core-recall-answer {
            max-width: 680px;
            margin: 18px auto;
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 18px;

        .core-recall-feeling {

            font-weight: 700;
            line-height: 1.5;
            color: #1e293b;
        }
        .core-recall-image {
            margin-top: 10px;
            color: #475569;
            font-size: 14px;
        }
        .core-recall-keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }
        .core-recall-keywords span {
            background: #4f46e5;

            padding: 2px 12px;

        }
        .core-recall-chain {

        }
        .core-recall-hint {

        }
        .core-recall-actions {
            display: flex;
            justify-content: center;

        }
        .core-recall-actions button {
            border: none;
            border-radius: 30px;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: #e2e8f0;
            color: #334155;
        }
        .core-recall-actions button:hover {
            background: #cbd5e1;
        }
        .core-recall-actions button[data-grade="2"] {
            background: #dcfce7;
            color: #166534;
        }
        .core-recall-actions button[data-grade="2"]:hover {
            background: #bbf7d0;
        }
        .core-recall-missing {
            max-width: 680px;
            margin: 18px auto;
            padding: 20px;
            border: 1px dashed #cbd5e1;
            border-radius: 18px;
            background: #f8fafc;
            text-align: left;
        }
        .core-recall-missing-title {
            font-size: 18px;
            font-weight: 700;
            color: #334155;
        }
        .core-recall-missing-desc {
            margin-top: 6px;
            font-size: 13px;
            color: #64748b;
            line-height: 1.6;
        }
        .core-recall-legacy {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
        }
        .core-recall-legacy-label {
            font-size: 12px;
            font-weight: 600;
            color: #c2410c;
            margin-bottom: 6px;
        }
        .core-recall-legacy-text {
            font-size: 13px;
            color: #7c2d12;
            line-height: 1.7;
            white-space: pre-wrap;
            max-height: 220px;
            overflow-y: auto;
        }

        /* 单词接龙游戏 */
        .wordchain-game .chain-container {
            max-width: 700px;
            margin: 0 auto;
        }
        .wordchain-game .chain-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #f8fafc;
            border-radius: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .wordchain-game .chain-header .chain-hint {
            font-size: 15px;
            font-weight: 500;
            color: #1e293b;
        }
        .wordchain-game .chain-header .chain-hint .letter {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 0 12px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 18px;
            margin: 0 4px;
        }
        .wordchain-game .chain-header .chain-count {
            font-size: 14px;
            color: #64748b;
        }
        .wordchain-game .chain-list {
            max-height: 400px;
            overflow-y: auto;
            background: #fafcff;
            border-radius: 16px;
            border: 1px solid #e9edf2;
            padding: 8px 0;
            margin-bottom: 16px;
        }
        .wordchain-game .chain-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 18px;
            border-bottom: 1px solid #f1f5f9;
            transition: 0.1s;
        }
        .wordchain-game .chain-item:last-child {
            border-bottom: none;
        }
        .wordchain-game .chain-item .chain-index {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            min-width: 28px;
            text-align: right;
        }
        .wordchain-game .chain-item .chain-word {
            font-weight: 600;
            font-size: 17px;
            color: #0f172a;
            min-width: 80px;
        }
        .wordchain-game .chain-item .chain-phonetic {
            font-size: 13px;
            color: #64748b;
            font-family: 'Times New Roman', serif;
        }
        .wordchain-game .chain-item .chain-def {
            font-size: 14px;
            color: #475569;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .wordchain-game .chain-item .chain-arrow {
            color: #94a3b8;
            font-size: 14px;
            padding: 0 2px;
        }
        .wordchain-game .chain-item.current .chain-word {
            color: #1d4ed8;
        }
        .wordchain-game .chain-item.system .chain-word {
            color: #065f46;
        }
        .wordchain-game .chain-item.user .chain-word {
            color: #6b21a5;
        }
        .wordchain-game .chain-input-area {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .wordchain-game .chain-input-area input {
            flex: 1;
            min-width: 180px;
            padding: 10px 16px;
            border: 2px solid #d1d5db;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            background: white;
        }
        .wordchain-game .chain-input-area input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .wordchain-game .chain-input-area input:disabled {
            background: #f1f5f9;
            opacity: 0.6;
        }
        .wordchain-game .chain-input-area .chain-submit {
            padding: 10px 28px;
            border: none;
            border-radius: 30px;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
        }
        .wordchain-game .chain-input-area .chain-submit:hover:not(:disabled) {
            background: #2563eb;
        }
        .wordchain-game .chain-input-area .chain-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .wordchain-game .chain-input-area .chain-restart {
            padding: 10px 24px;
            border: 2px solid #e2e8f0;
            border-radius: 30px;
            background: white;
            color: #475569;
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
        }
        .wordchain-game .chain-input-area .chain-restart:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .wordchain-game .chain-error {
            color: #ef4444;
            font-size: 14px;
            margin-top: 8px;
            min-height: 24px;
        }
        .wordchain-game .chain-gameover {
            background: #fef2f2;
            border: 2px solid #fecaca;
            border-radius: 16px;
            padding: 20px 24px;
            text-align: center;
            margin-top: 12px;
        }
        .wordchain-game .chain-gameover .gameover-title {
            font-size: 22px;
            font-weight: 700;
            color: #b91c1c;
        }
        .wordchain-game .chain-gameover .gameover-stats {
            font-size: 15px;
            color: #475569;
            margin-top: 6px;
        }

        /* 新增游戏通用样式 */
        .game-container {
            padding: 4px 0;
        }
        .game-question {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin: 20px 0 16px;
        }
        .game-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }
        .game-options button {
            padding: 14px 10px;
            border: 2px solid #d1d5db;
            border-radius: 16px;
            background: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            font-weight: 500;
            color: #0f172a;
            text-align: center;
        }
        .game-options button:hover:not(:disabled) {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        .game-options button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .game-options button.correct-answer {
            border-color: #22c55e;
            background: #dcfce7;
        }
        .game-options button.wrong-answer {
            border-color: #ef4444;
            background: #fee2e2;
        }
        .game-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
            padding: 10px 16px;
            background: #f8fafc;
            border-radius: 12px;
            font-size: 15px;
        }
        .game-status .score {
            font-weight: 700;
            color: #1d4ed8;
        }
        .game-status .timer {
            font-weight: 600;
            color: #dc2626;
        }
        .game-skip-audio {
            background: #f1f5f9;
            border: none;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            color: #475569;
            transition: 0.15s;
        }
        .game-skip-audio:hover {
            background: #e2e8f0;
        }
        .game-input {
            max-width: 400px;
            margin: 16px auto;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .game-input input {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 2px solid #d1d5db;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
        }
        .game-input input:focus {
            border-color: #3b82f6;
        }
        .game-input button {
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
        }
        .game-input button:hover:not(:disabled) {
            background: #2563eb;
        }
        .game-input button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .game-progress {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-top: 12px;
        }
        .game-result {
            text-align: center;
            padding: 30px 0;
        }
        .game-result .big-score {
            font-size: 48px;
            font-weight: 700;
            color: #1d4ed8;
        }
        .game-result .sub {
            font-size: 18px;
            color: #475569;
            margin-top: 8px;
        }
        .game-result button {
            margin-top: 20px;
            padding: 10px 32px;
            border: none;
            border-radius: 30px;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }
        .game-result button:hover {
            background: #2563eb;
        }
        /* 消消乐网格 */
        .match-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }
        .match-grid .match-card {
            aspect-ratio: 1 / 1;
            background: white;
            border: 2px solid #d1d5db;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            padding: 6px;
            text-align: center;
            word-break: break-word;
            user-select: none;
        }
        .match-grid .match-card.selected {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        .match-grid .match-card.matched {
            border-color: #22c55e;
            background: #dcfce7;
            cursor: default;
            opacity: 0.7;
        }
        .match-grid .match-card.wrong-match {
            border-color: #ef4444;
            background: #fee2e2;
        }
        .match-grid .match-card:hover:not(.matched) {
            background: #f1f5f9;
        }
        /* 迷宫样式 */
        .maze-path {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .maze-step {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #94a3b8;
        }
        .maze-step .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #e2e8f0;
            border: 2px solid #cbd5e1;
        }
        .maze-step.active .dot {
            background: #3b82f6;
            border-color: #1d4ed8;
        }
        .maze-step.completed .dot {
            background: #22c55e;
            border-color: #16a34a;
        }
        .maze-step.failed .dot {
            background: #ef4444;
            border-color: #b91c1c;
        }

        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gap-4 {
            gap: 4px;
        }
        .gap-8 {
            gap: 8px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: #64748b;
        }
        .text-sm {
            font-size: 14px;
        }
        .font-bold {
            font-weight: 700;
        }
        /* 反馈提示 */
        .feedback-banner {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            padding: 8px;
            border-radius: 12px;
            margin: 8px 0;
        }
        .feedback-banner.correct {
            background: #dcfce7;
            color: #166534;
        }
        .feedback-banner.wrong {
            background: #fee2e2;
            color: #b91c1c;
        }
        /* 创意造句样式 */
        .word-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 16px 0;
        }
        .word-chip {
            background: #eef2ff;
            border-radius: 30px;
            padding: 6px 16px;
            font-weight: 600;
            font-size: 16px;
            border: 2px solid #c7d2fe;
            color: #3730a3;
        }
        .word-chip.used {
            background: #dcfce7;
            border-color: #86efac;
            color: #166534;
            text-decoration: line-through;
            opacity: 0.7;
        }
        .creative-textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 2px solid #d1d5db;
            border-radius: 16px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: 0.15s;
        }
        .creative-textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .creative-textarea:disabled {
            background: #f1f5f9;
        }
        .creative-feedback {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e9edf2;
        }
        .creative-feedback .stat {
            font-weight: 600;
            color: #1d4ed8;
        }
        .creative-feedback .missing {
            color: #dc2626;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- 顶栏 -->
        <div class="top-bar">
            <h1>📖 智能单词本 <span class="version-tag">0.3 beta</span></h1>
            <button class="nav-btn active" data-mode="dictionary">📚 单词本</button>
            <button class="nav-btn" data-mode="review">🎴 复习中心</button>
            <button class="nav-btn" data-mode="daily">📅 今日</button>
            <button class="nav-btn" data-mode="stats">📊 统计</button>
            <button class="nav-btn" data-mode="backup">🗄️ 备份</button>
            <button class="nav-btn" data-mode="settings">⚙️ 设置</button>
            <button class="nav-btn" data-mode="recycle">♻️ 回收站</button>
            <button class="nav-btn" id="randomBtn">🎲 随机</button>
            <button class="nav-btn" id="batchManageBtn">📦 批量管理</button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索..." />
                <button class="clear-btn" id="clearSearchBtn">✕</button>
            </div>
            <button class="tool-btn export-btn" id="exportBtn">📤 导出</button>
            <button class="tool-btn import-btn" id="importBtn">📥 导入</button>
        </div>

        <div class="main" id="mainContainer">
            <!-- 左侧面板 -->
            <div class="left-panel" id="leftPanel">
                <div class="alpha-nav" id="alphaNav"></div>
                <div class="left-content">
                    <div class="batch-mode-bar" id="batchModeBar">
                        <span class="batch-info">📦 批量管理模式</span>
                        <button class="batch-btn batch-select-all" id="batchSelectAllBtn">☑️ 全选</button>
                        <button class="batch-btn batch-delete" id="batchDeleteBtn">🗑 批量删除</button>
                        <button class="batch-btn batch-empty-recycle" id="emptyRecycleBtn" style="display:none;background:#991b1b;color:white;">🗑 清空回收站</button>
                        <button class="batch-btn batch-cancel" id="batchCancelBtn">✕ 退出</button>
                    </div>
                    <div class="panel-header">
                        <span class="mode-title">词库<select id="deckSelect"><option value="all">全部单词</option></select></span>
                        <span class="mode-title">分组依据<select id="groupBySelect">
                            <option value="hierarchy">📂 层级列表</option>
                            <option value="alphabetical">🔤 字母</option>
                            <option value="tone">😊 情感色彩</option>
                            <option value="topic">📚 主题</option>
                            <option value="pos">📌 词性</option>
                            <option value="level">⭐ 难度</option>
                            <option value="origin">🌍 来源</option>
                            <option value="formality">📝 语体</option>
                            <option value="grammar">📖 语法属性</option>
                        </select></span>
                        <span>
                            <button class="action-btn add-word" id="addWordBtn">➕ 添加单词</button>
                        </span>
                    </div>
                    <div class="add-word-form" id="addWordForm">
                        <div class="form-title">📝 添加新单词</div>
                        <div class="form-grid">
                            <div class="form-group full-width">
                                <label>单词 <span class="required">*</span></label>
                                <div class="word-input-wrapper">
                                    <input type="text" id="newWord" placeholder="请输入单词" />
                                    <button class="fetch-btn" id="fetchBtn">🔍 自动补全</button>
                                </div>
                            </div>
                            <div class="form-group"><label>音标</label><input type="text" id="newPhonetic" placeholder="如 /əˈbaɪd/" /></div>
                            <div class="form-group"><label>主注释</label><input type="text" id="newNote" placeholder="可选" /></div>
                            <div class="form-group full-width"><label>释义 <span class="required">*</span></label><textarea id="newDefinition" placeholder="请输入释义" rows="2"></textarea></div>
                            <div class="form-group full-width"><label>例句</label><textarea id="newExample" placeholder="请输入例句" rows="2"></textarea></div>
                            <div class="form-error" id="formError">请至少填写 单词 和 释义。</div>
                            <div class="form-actions">
                                <button class="cancel-btn" id="cancelAddWordBtn">取消</button>
                                <button class="save-btn" id="saveWordBtn">💾 保存</button>
                            </div>
                        </div>
                    </div>
                    <div class="search-summary" id="searchSummary"></div>
                    <div class="list-container" id="listContainer"></div>
                </div>
            </div>

            <!-- 右侧面板 -->
            <div class="right-panel" id="rightPanel">
                <div class="detail-placeholder">👆 点击左侧条目查看详情</div>
            </div>
        </div>
    </div>

    <!-- 分类管理弹窗已移除：0.1 不再使用“所属分类”功能 -->

    <!-- 冲突弹窗 -->
    <div class="conflict-modal-overlay" id="conflictModalOverlay">
        <div class="conflict-modal">
            <button class="close-modal" id="closeConflictModalBtn">✕</button>
            <h2>⚠️ 检测到导入冲突</h2>
            <p class="conflict-subtitle">以下单词与现有单词本中的单词同名，请选择处理方式。</p>

    <script>
        // ============================================================
        //  IndexedDB 封装
        // ============================================================
        class VocabDB {
            constructor() {
                this.db = null;
                this.DB_NAME = 'SmartVocabDB_v9';
                this.DB_VERSION = 5;
            }
            async init() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(this.DB_NAME, this.DB_VERSION);
                    req.onerror = () => reject(req.error);
                    req.onsuccess = () => { this.db = req.result;
                        resolve(); };
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('words')) {
                            const wStore = db.createObjectStore('words', { keyPath: 'id' });
                            wStore.createIndex('by_word', 'word', { unique: false });
                            wStore.createIndex('by_deleted', 'deleted', { unique: false });
                        }
                        if (!db.objectStoreNames.contains('extras')) {
                            db.createObjectStore('extras', { keyPath: 'key' });
                        }
                        if (!db.objectStoreNames.contains('progress')) {
                            db.createObjectStore('progress', { keyPath: 'key' });
                        }
                        if (!db.objectStoreNames.contains('backups')) {
                            db.createObjectStore('backups', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('decks')) {
                            db.createObjectStore('decks', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('deckWords')) {
                            db.createObjectStore('deckWords', { keyPath: 'key' });
                        }
                    };
                });
            }
            async getAllWords() {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('words', 'readonly');
                    const store = tx.objectStore('words');
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });
            }
            async getExtras() {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('extras', 'readonly');
                    const req = tx.objectStore('extras').getAll();
                    req.onsuccess = () => {
                        const out = { rootFamilies: [], synonymGroups: [], confusionPairs: [] };
                        (req.result || []).forEach(row => {
                            if (row && row.key) out[row.key] = row.value;
                        });
                        resolve(out);
                    };
                    req.onerror = () => reject(req.error);
                });
            }
            async getProgress() {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('progress', 'readonly');
                    const req = tx.objectStore('progress').getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });
            }
            async saveProgress(progress) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('progress', 'readwrite');
                    const store = tx.objectStore('progress');
                    store.clear();
                    for (const p of progress) store.put(p);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            async getBackups() {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('backups', 'readonly');
                    const req = tx.objectStore('backups').getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });
            }
            async saveBackup(snapshot) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('backups', 'readwrite');
                    tx.objectStore('backups').put(snapshot);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            async deleteBackup(id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('backups', 'readwrite');
                    tx.objectStore('backups').delete(id);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            async getDecks() {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('decks', 'readonly');
                    const req = tx.objectStore('decks').getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });
            }
            async saveDecks(decks) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('decks', 'readwrite');
                    const store = tx.objectStore('decks');
                    store.clear();
                    for (const d of decks) store.put(d);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            async getDeckWords() {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('deckWords', 'readonly');
                    const req = tx.objectStore('deckWords').getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });
            }
            async saveDeckWords(records) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('deckWords', 'readwrite');
                    const store = tx.objectStore('deckWords');
                    store.clear();
                    for (const r of records) store.put(r);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            async saveWords(words) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('words', 'readwrite');
                    const store = tx.objectStore('words');
                    store.clear();
                    for (const w of words) store.put(w);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            async saveExtras(extras) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('extras', 'readwrite');
                    const store = tx.objectStore('extras');
                    store.clear();
                    ['rootFamilies', 'synonymGroups', 'confusionPairs'].forEach(key => {
                        store.put({ key, value: Array.isArray(extras[key]) ? extras[key] : [] });
                    });
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
        }

        // ============================================================
        //  搜索索引（子串匹配）
        // ============================================================
        // v2.3.1：不再要求「整词精确命中」。为每个单词缓存一份小写可搜索文本，
        // 英文按子串、中文按包含匹配；空格分隔的多个关键词使用 AND 语义。
        class SearchIndex {
            constructor() {
                this.textMap = new Map();
            }
            clear() {
                this.textMap.clear();
            }
            normalize(text) {
                return String(text == null ? '' : text).toLowerCase();
            }
            collectText(word) {
                const parts = [word.word, word.phonetic, ...(word.wordNotes || [])];
                (word.senses || []).forEach(s => {
                    parts.push(s.definition, s.example, s.synonyms, s.collocations, s.pitfall);
                    (s.notes || []).forEach(n => parts.push(n));
                    parts.push(s.tone, s.topic, s.pos, s.level, s.origin, s.formality, s.grammar);
                });
                return this.normalize(parts.filter(Boolean).join('\n'));
            }
            addWord(word) {
                this.textMap.set(word.id, this.collectText(word));
            }
            removeWord(wordId) {
                this.textMap.delete(wordId);
            }
            rebuild(words) {
                this.clear();
                for (const w of words) this.addWord(w);
            }
            search(query) {
                const q = this.normalize(query).trim();
                if (!q) return null;
                const tokens = q.split(/\s+/)
                    .map(t => t.replace(/^[\s,.;:!?，。；：！？"'()\[\]{}<>]+|[\s,.;:!?，。；：！？"'()\[\]{}<>]+$/g, ''))
                    .filter(Boolean);
                if (tokens.length === 0) return null;
                const result = new Set();
                for (const [id, text] of this.textMap) {
                    if (tokens.every(t => text.includes(t))) result.add(id);
                }
                return result;
            }
        }

        // ============================================================
        //  主应用
        // ============================================================
        const App = {
            db: new VocabDB(),
            searchIndex: new SearchIndex(),
            words: [],
            extras: { rootFamilies: [], synonymGroups: [], confusionPairs: [] },
            progress: new Map(),
            backups: [],
            fileBackups: [],
            lastBackupAt: 0,
            decks: [],
            deckWords: new Set(),
            activeDeckId: 'all',
            decksLoaded: false,
            settings: { autoNext: true, autoNextDelay: 1500 },
            pendingNext: null,
            pendingNextTimer: null,
            undoStack: [],
            redoStack: [],
            applyingUndo: false,
            importOptions: { mode: 'normal', newDeckName: '', targetDeckId: null },
            currentMode: 'dictionary',
            currentGroupBy: 'hierarchy',
            currentWordId: null,
            currentSenseId: null,
            searchQuery: '',
            batchMode: false,
            selectedWordIds: new Set(),
            saveTimer: null,
            saveSeq: 0,
            dataDirty: false,
            reviewDirty: false,
            reviewSaveTimer: null,
            idSeq: 0,
            importSkipped: 0,
            importConflictData: null,
            lastDeletedId: null,
            toastTimer: null,

            currentGame: null,
            flashcardIndex: 0,
            flashcardFlipped: false,
            flashcardSenseId: null,
            dailyLimits: { newLimit: 20, dueLimit: 60 },
            dailySession: null,

            games: {},

            gameStates: {},

            async init() {
                await this.db.init();
                await this.loadData();
                await this.loadDecks();
                this.loadSettings();
                this.seedIdSequence();
                this.buildIndex();
                this.registerGames();
                this.bindEvents();
                this.renderAlphaNav();
                const display = this.getDisplayWords();
                if (display.length > 0) { this.currentWordId = display[0].id;
                    this.currentSenseId = null; }
                this.render();
                this.autoBackupIfNeeded().catch(e => console.error(e));
                setInterval(() => this.autoBackupIfNeeded(), 6 * 3600 * 1000);
            },

            registerGames() {
                this.games = {
                    flashcard: {
                        id: 'flashcard',
                        name: '翻卡牌',
                        icon: '🃏',
                        desc: '自主复习，点击卡片翻转查看释义',
                        badge: '经典',
                        render: () => this.renderFlashcardGame()
                    },
                    coreRecall: {
                        id: 'coreRecall',
                        name: '核心回忆',
                        icon: '🧭',
                        desc: '看单词先回忆核心感觉，再揭示答案',
                        badge: '核心',
                        render: () => this.renderCoreRecallGame()
                    },
                    synonymChallenge: {
                        id: 'synonymChallenge',
                        name: '近义辨析',
                        icon: '⚖️',
                        desc: '在一组近义词里选出最贴合语境的一个',
                        badge: '辨析',
                        render: () => this.renderSynonymChallenge()
                    },
                    rootChallenge: {
                        id: 'rootChallenge',
                        name: '词根拆解',
                        icon: '🌱',
                        desc: '拆词根、看字面义、连同根词',
                        badge: '词根',
                        render: () => this.renderRootChallenge()
                    },
                    senseChain: {
                        id: 'senseChain',
                        name: '词义链',
                        icon: '🪜',
                        desc: '看例句或词义链阶段，选择对应义项',
                        badge: '义项',
                        render: () => this.renderSenseChainGame()
                    },
                    spellingChallenge: {
                        id: 'spellingChallenge',
                        name: '拼写挑战',
                        icon: '✍️',
                        desc: '看释义或听发音，拼出完整的单词',
                        badge: '拼写',
                        render: () => this.renderSpellingChallenge()
                    },
                    wordShooter: {
                        id: 'wordShooter',
                        name: '单词射手',
                        icon: '🎯',
                        desc: '每题10秒，快速从四个选项中选出正确的释义',
                        badge: '瞄准',
                        render: () => this.renderWordShooter()
                    },
                    wordMatch: {
                        id: 'wordMatch',
                        name: '消消乐',
                        icon: '🧩',
                        desc: '匹配单词和释义，全部消除过关',
                        badge: '配对',
                        render: () => this.renderWordMatch()
                    },
                    creativeWriting: {
                        id: 'creativeWriting',
                        name: '创意造句',
                        icon: '✏️',
                        desc: '用给出的单词组成一个连贯的句子或小故事',
                        badge: '创意',
                        render: () => this.renderCreativeWriting()
                    }
                };
            },

            genId() {
                const base = Date.now() * 1000;
                this.idSeq = Math.max(this.idSeq || 0, base) + 1;
                return this.idSeq;
            },

            seedIdSequence() {
                let max = 0;
                const consider = (id) => {
                    const n = Number(id);
                    if (Number.isFinite(n) && n > max) max = n;
                };
                this.words.forEach(w => {
                    consider(w.id);
                    (w.senses || []).forEach(s => consider(s.id));
                });
                this.idSeq = Math.max(this.idSeq || 0, max, Date.now() * 1000);
            },

            async saveData(immediate = false) {
                clearTimeout(this.saveTimer);
                this.dataDirty = true;
                const seq = ++this.saveSeq;
                const doSave = async () => {
                    try {
                        await this.db.saveWords(this.words);
                        await this.db.saveExtras(this.extras);
                        await this.db.saveProgress([...this.progress.values()]);
                        if (this.decksLoaded) {
                            await this.db.saveDecks(this.decks);
                            await this.db.saveDeckWords([...this.deckWords].map(key => {
                                const i = key.lastIndexOf(':');
                                return { key, deckId: key.slice(0, i), wordId: Number(key.slice(i + 1)) };
                            }));
                        }
                        if (seq === this.saveSeq) this.dataDirty = false;
                    } catch (e) { console.error('Save failed:', e); }
                };
                if (immediate) await doSave();
                else this.saveTimer = setTimeout(doSave, 500);
            },

            async flushSave() {
                if (!this.dataDirty && !this.reviewDirty) return;
                clearTimeout(this.saveTimer);
                clearTimeout(this.reviewSaveTimer);
                this.reviewDirty = false;
                const seq = ++this.saveSeq;
                try {
                    await this.db.saveWords(this.words);
                    await this.db.saveExtras(this.extras);
                    await this.db.saveProgress([...this.progress.values()]);
                    if (this.decksLoaded) {
                        await this.db.saveDecks(this.decks);
                        await this.db.saveDeckWords([...this.deckWords].map(key => {
                            const i = key.lastIndexOf(':');
                            return { key, deckId: key.slice(0, i), wordId: Number(key.slice(i + 1)) };
                        }));
                    }
                    if (seq === this.saveSeq) this.dataDirty = false;
                } catch (e) { console.error('Flush save failed:', e); }
            },

            senseKey(wordId, senseId) {
                return `${wordId}:${senseId}`;
            },

            // 0.2.1：义项级间隔重复。先用简单步进，后续可替换成 FSRS。
            scheduleSenseReview(wordId, senseId, grade, now = Date.now()) {
                const key = this.senseKey(wordId, senseId);
                let p = this.progress.get(key);
                if (!p) {
                    p = {
                        key, wordId, senseId,
                        dueAt: now, interval: 0, ease: 2.5, reps: 0, lapses: 0,
                        lastGrade: null, wrongCount: 0, lastReviewedAt: 0, createdAt: now,
                        wrongActive: false, consecutiveCorrect: 0
                    };
                    this.progress.set(key, p);
                }
                p.lastReviewedAt = now;
                p.lastGrade = grade;
                const dayMs = 86400000;
                if (grade <= 0) {
                    p.reps = 0;
                    p.lapses = (p.lapses || 0) + 1;
                    p.wrongCount = (p.wrongCount || 0) + 1;
                    p.wrongActive = true;
                    p.consecutiveCorrect = 0;
                    p.interval = 0;
                    p.ease = Math.max(1.3, (p.ease || 2.5) - 0.2);
                    p.dueAt = now + 10 * 60 * 1000;
                } else if (grade === 1) {
                    p.reps = (p.reps || 0) + 1;
                    p.consecutiveCorrect = 0;
                    p.interval = 1;
                    p.ease = Math.max(1.3, (p.ease || 2.5) - 0.05);
                    p.dueAt = now + p.interval * dayMs;
                } else {
                    p.reps = (p.reps || 0) + 1;
                    p.consecutiveCorrect = (p.consecutiveCorrect || 0) + 1;
                    if (p.wrongActive && p.consecutiveCorrect >= 2) p.wrongActive = false;
                    const steps = [1, 3, 7, 14, 30];
                    if (p.reps <= steps.length) p.interval = steps[p.reps - 1];
                    else p.interval = Math.min(180, Math.max(1, Math.round((p.interval || 1) * (p.ease || 2.5))));
                    p.ease = Math.min(3.0, (p.ease || 2.5) + 0.05);
                    p.dueAt = now + p.interval * dayMs;
                }
                p.updatedAt = now;
                return p;
            },

            // 复习结果统一回写：供所有游戏调用，避免只有翻卡牌更新掌握度。
            recordReview(wordId, correct, senseId = null, grade = null) {
                const w = this.words.find(x => x.id === wordId);
                if (!w) return;
                w.lastReviewDate = Date.now();
                w.reviewCount = (w.reviewCount || 0) + 1;
                if (correct) {
                    w.correctCount = (w.correctCount || 0) + 1;
                    if (w.mastery !== 'mastered') w.mastery = 'learning';
                } else {
                    w.mastery = 'learning';
                }
                const g = (grade === null || grade === undefined) ? (correct ? 2 : 0) : Number(grade);
                if (senseId !== null && senseId !== undefined) {
                    this.scheduleSenseReview(wordId, senseId, Number.isFinite(g) ? g : (correct ? 2 : 0));
                }
                this.reviewDirty = true;
                this.dataDirty = true;
                clearTimeout(this.reviewSaveTimer);
                this.reviewSaveTimer = setTimeout(() => {
                    this.reviewDirty = false;
                    this.saveData();
                }, 5000);
            },

            flushReview() {
                if (!this.reviewDirty) return;
                this.reviewDirty = false;
                clearTimeout(this.reviewSaveTimer);
                this.saveData();
            },

            async loadData() {
                let words = await this.db.getAllWords();
                const extras = await this.db.getExtras();
                this.extras = {
                    rootFamilies: Array.isArray(extras.rootFamilies) ? extras.rootFamilies : [],
                    synonymGroups: Array.isArray(extras.synonymGroups) ? extras.synonymGroups : [],
                    confusionPairs: Array.isArray(extras.confusionPairs) ? extras.confusionPairs : [],
                };
                const progressRows = await this.db.getProgress();
                this.progress = new Map((progressRows || []).filter(p => p && p.key).map(p => [p.key, p]));
                this.progress.forEach(p => {
                    if (p.wrongCount > 0 && p.wrongActive === undefined) p.wrongActive = true;
                    if (typeof p.consecutiveCorrect !== 'number') p.consecutiveCorrect = 0;
                });
                if (words.length === 0) {
                    const oldWords = localStorage.getItem('myWordsData_v8_2');
                    if (oldWords) { try { words = JSON.parse(oldWords); } catch (e) {} localStorage.removeItem(
                        'myWordsData_v8_2'); }
                    localStorage.removeItem('myCategoriesData_v8_2');
                }
                if (words.length === 0) {
                    words = [{
                        id: 1,
                        word: 'abide',
                        phonetic: '/əˈbaɪd/',
                        wordNotes: ['这个单词有两个主要意思，注意区分。'],
                        senses: [

            deckKey(deckId, wordId) {
                return `${deckId}:${wordId}`;

            async loadDecks() {
                let decks = await this.db.getDecks();
                let records = await this.db.getDeckWords();
                if (!decks.length) {
                    const now = Date.now();
                    decks = [{ id: 'default', name: '我的词库', kind: 'user', readOnly: false, createdAt: now, updatedAt: now }];
                    records = this.words.map(w => ({ key: this.deckKey('default', w.id), deckId: 'default', wordId: w.id }));
                    await this.db.saveDecks(decks);
                    await this.db.saveDeckWords(records);
                } else {
                    // 老数据升级：没有归属的单词放进默认词库
                    const defaultDeck = decks.find(d => d.id === 'default') || decks[0];
                    const assigned = new Set(records.map(r => r.wordId));
                    const add = [];
                    this.words.forEach(w => {
                        if (!assigned.has(w.id)) {
                            const rec = { key: this.deckKey(defaultDeck.id, w.id), deckId: defaultDeck.id, wordId: w.id };
                            records.push(rec);
                            add.push(rec);
                        }
                    });
                    if (add.length) await this.db.saveDeckWords(records);
                }
                this.decks = decks;
                this.deckWords = new Set(records.map(r => r.key));
                this.decksLoaded = true;
                const saved = localStorage.getItem('smartVocabActiveDeck');
                this.activeDeckId = (saved === 'all' || decks.some(d => d.id === saved)) ? saved : 'all';
            },

            defaultDeckId() {
                const d = this.decks.find(x => x.id === 'default') || this.decks[0];
                return d ? d.id : null;
            },

            wordInActiveDeck(word) {
                if (this.activeDeckId === 'all') return true;
                return !!word && this.deckWords.has(this.deckKey(this.activeDeckId, word.id));
            },

            async createDeck(name) {
                const clean = String(name || '').trim();
                if (!clean) return null;
                if (this.decks.some(d => d.name === clean)) {
                    this.showToast('同名词库已存在', 'info');
                    return null;
                }
                const now = Date.now();
                const deck = { id: `deck-${now}-${Math.random().toString(36).slice(2, 6)}`, name: clean, kind: 'user', readOnly: false, createdAt: now, updatedAt: now };
                this.pushUndo('新建词库');
                this.decks.push(deck);
                await this.db.saveDecks(this.decks);
                this.setActiveDeck(deck.id);
                return deck;
            },

            setActiveDeck(id) {
                if (id !== 'all' && !this.decks.some(d => d.id === id)) id = 'all';
                this.activeDeckId = id;
                try { localStorage.setItem('smartVocabActiveDeck', id); } catch (e) { /* ignore */ }
                this.render();
            },

            updateDeckSelect() {
                const select = document.getElementById('deckSelect');
                if (!select) return;
                const counts = {};
                this.deckWords.forEach(key => {
                    const deckId = key.slice(0, key.lastIndexOf(':'));
                    counts[deckId] = (counts[deckId] || 0) + 1;
                });
                select.innerHTML = [
                    `<option value="all">全部单词（${this.words.filter(w => !w.deleted).length}）</option>`,
                    ...this.decks.map(d => `<option value="${this.escapeHtml(d.id)}">${this.escapeHtml(d.name)}（${counts[d.id] || 0}）${d.readOnly ? ' 🔒' : ''}</option>`),
                    '<option value="__manage__">⚙️ 管理词库</option>',
                    '<option value="__new__">＋ 新建词库</option>'
                ].join('');
                select.value = this.activeDeckId;
            },

            async renameDeck(id) {
                const deck = this.decks.find(d => d.id === id);
                if (!deck || deck.readOnly) return;
                const name = await this.askText('重命名词库', deck.name);
                if (!name || name === deck.name) return;
                if (this.decks.some(d => d.id !== id && d.name === name.trim())) {
                    this.showToast('同名词库已存在', 'info');
                    return;
                }
                this.pushUndo('重命名词库');
                deck.name = name.trim();
                deck.updatedAt = Date.now();
                await this.saveData(true);
                this.render();
            },

            async deleteDeck(id) {
                const deck = this.decks.find(d => d.id === id);
                if (!deck) return;
                if (deck.id === 'default') {
                    this.showToast('默认词库不能删除', 'info');
                    return;
                }
                if (deck.readOnly) {
                    this.showToast('标准词库不能删除', 'info');
                    return;
                }
                const count = [...this.deckWords].filter(k => k.startsWith(id + ':')).length;
                if (!confirm(`删除词库「${deck.name}」？\n只会解除 ${count} 个单词与这个词库的关联，不会删除单词本身。`)) return;
                this.pushUndo('删除词库');
                this.decks = this.decks.filter(d => d.id !== id);
                for (const key of [...this.deckWords]) {
                    if (key.startsWith(id + ':')) this.deckWords.delete(key);
                }
                if (this.activeDeckId === id) this.activeDeckId = 'all';
                try { localStorage.setItem('smartVocabActiveDeck', this.activeDeckId); } catch (e) { /* ignore */ }
                await this.saveData(true);
                this.render();
            },

            renderDeckManager(container) {

                this.deckWords.forEach(key => {
                    const deckId = key.slice(0, key.lastIndexOf(':'));
                    counts[deckId] = (counts[deckId] || 0) + 1;

                const cards = this.decks.map(d => `

                        <div class="deck-card-main">
                            <div class="deck-name">${this.escapeHtml(d.name)} ${d.readOnly ? '🔒' : ''}</div>
                            <div class="deck-meta">${d.kind === 'standard' ? '标准词库' : '用户词库'} · ${counts[d.id] || 0} 个单词${d.id === this.activeDeckId ? ' · 当前使用' : ''}</div>
                        </div>
                        <div class="deck-card-actions">
                            <button class="deck-use" data-id="${this.escapeHtml(d.id)}">${d.id === this.activeDeckId ? '✓ 当前' : '使用'}</button>

                    btn.addEventListener('click', () => this.setActiveDeck(btn.dataset.id));

                container.querySelectorAll('.deck-rename').forEach(btn => {

            loadSettings() {
                try {
                    const raw = localStorage.getItem('smartVocabSettings');
                    if (raw) {
                        const s = JSON.parse(raw);
                        this.settings.autoNext = s.autoNext !== false;
                        const d = Number(s.autoNextDelay);
                        if (Number.isFinite(d)) this.settings.autoNextDelay = Math.max(300, Math.min(10000, d));
                    }
                } catch (e) { /* ignore */ }
            },

            saveSettings() {
                try { localStorage.setItem('smartVocabSettings', JSON.stringify(this.settings)); } catch (e) { /* ignore */ }
            },

            snapshotData() {
                return JSON.parse(JSON.stringify({
                    words: this.words,
                    extras: this.extras,
                    progress: [...this.progress.values()],
                    decks: this.decks,
                    deckWords: [...this.deckWords]
                }));
            },

            pushUndo(label) {
                if (this.applyingUndo) return;
                try {
                    this.undoStack.push({ label: label || '修改', snapshot: this.snapshotData() });
                    if (this.undoStack.length > 20) this.undoStack.shift();
                    this.redoStack = [];
                } catch (e) { console.error('Undo snapshot failed:', e); }
            },

            async applyUndoSnapshot(snapshot) {
                if (!snapshot) return;
                this.applyingUndo = true;
                try {
                    this.words = (snapshot.words || []).map(w => JSON.parse(JSON.stringify(w)));
                    this.extras = snapshot.extras || { rootFamilies: [], synonymGroups: [], confusionPairs: [] };
                    this.progress = new Map((snapshot.progress || []).filter(p => p && p.key).map(p => [p.key, p]));
                    this.decks = snapshot.decks || [];
                    this.deckWords = new Set(snapshot.deckWords || []);
                    this.decksLoaded = true;
                    if (this.activeDeckId !== 'all' && !this.decks.some(d => d.id === this.activeDeckId)) this.activeDeckId = 'all';
                    this.seedIdSequence();
                    this.buildIndex();
                    this.currentWordId = this.words[0] ? this.words[0].id : null;
                    this.currentSenseId = null;
                    this.currentGame = null;
                    await this.saveData(true);
                    this.render();
                } finally {
                    this.applyingUndo = false;
                }
            },

            async undo() {
                if (!this.undoStack.length) {
                    this.showToast('没有可撤销的操作', 'info');
                    return;
                }
                const entry = this.undoStack.pop();
                try { this.redoStack.push({ label: entry.label, snapshot: this.snapshotData() }); } catch (e) { /* ignore */ }
                await this.applyUndoSnapshot(entry.snapshot);
                this.showToast(`↩️ 已撤销：${entry.label}`, 'success');
            },

            async redo() {
                if (!this.redoStack.length) {
                    this.showToast('没有可重做的操作', 'info');
                    return;
                }
                const entry = this.redoStack.pop();
                try { this.undoStack.push({ label: entry.label, snapshot: this.snapshotData() }); } catch (e) { /* ignore */ }
                await this.applyUndoSnapshot(entry.snapshot);
                this.showToast(`↪️ 已重做：${entry.label}`, 'success');
            },

            cancelPendingNext() {
                if (this.pendingNextTimer) { clearTimeout(this.pendingNextTimer);
                    this.pendingNextTimer = null; }
                this.pendingNext = null;
                const btn = document.getElementById('manualNextBtn');
                if (btn && btn.parentNode) btn.parentNode.removeChild(btn);
            },

            showManualNextButton() {
                const panel = document.getElementById('rightPanel');
                if (!panel) return;
                const old = document.getElementById('manualNextBtn');
                if (old && old.parentNode) old.parentNode.removeChild(old);
                const btn = document.createElement('button');
                btn.id = 'manualNextBtn';
                btn.className = 'manual-next-btn';
                btn.textContent = '下一题 →';
                btn.addEventListener('click', () => {
                    const cb = this.pendingNext;
                    this.cancelPendingNext();
                    if (cb) cb();
                });
                panel.appendChild(btn);
            },

            scheduleNext(callback) {
                this.cancelPendingNext();
                if (this.settings.autoNext) {
                    this.pendingNextTimer = setTimeout(() => {
                        this.pendingNextTimer = null;
                        if (callback) callback();
                    }, this.settings.autoNextDelay);
                } else {
                    this.pendingNext = callback;
                    this.showManualNextButton();
                }
            },

            renderSettings(container) {
                container.innerHTML = `
                    <div class="settings-page">
                        <div class="settings-title">⚙️ 设置</div>
                        <div class="settings-card">
                            <label class="settings-row">
                                <span>
                                    <b>答完一题后自动进入下一题</b>
                                    <small>关闭后，答完题会显示「下一题」按钮，由你手动继续。</small>
                                </span>
                                <input type="checkbox" id="autoNextToggle" ${this.settings.autoNext ? 'checked' : ''}>
                            </label>
                            <div class="settings-row">
                                <span>
                                    <b>自动切换延迟</b>
                                    <small>自动进入下一题前停留的时间。</small>
                                </span>
                                <select id="autoNextDelaySelect">
                                    ${[800, 1200, 1500, 2000, 3000].map(ms => `<option value="${ms}" ${this.settings.autoNextDelay === ms ? 'selected' : ''}>${(ms / 1000).toFixed(1)} 秒</option>`).join('')}
                                </select>
