                        const currentWord = activeWords[this.flashcardIndex];
                        if (!currentWord) return;
                        if (action === 'mastered' || action === 'unknown') {
                            this.recordReview(currentWord.id, action === 'mastered', this.flashcardSenseId);
                        }
                        this.flashcardIndex = (this.flashcardIndex + 1) % activeWords.length;
                        this.flashcardFlipped = false;
                        this.flashcardSenseId = null;
                        this.renderFlashcardGame();
                        this.renderList();
                    });
                });
                const backBtn = document.getElementById('flashcardBackBtn');
                if (backBtn) backBtn.addEventListener('click', () => this.leaveGame());
            },

            // ============================================================
            //  核心回忆（0.1 新增）
            // ============================================================
            renderCoreRecallGame() {
                const container = document.getElementById('rightPanel');
                const activeWords = this.words.filter(w => !w.deleted);
                if (activeWords.length === 0) {
                    container.innerHTML =
                        `<div class="game-container"><div class="empty-review">🎉 没有可复习的单词</div></div>`;
                    return;
                }
                const state = this.gameStates.coreRecall || {};
                if (!state.order || state.order.length === 0) {
                    state.order = [...activeWords].sort(() => Math.random() - 0.5).map(w => w.id);
                    state.index = 0;
                    state.correct = 0;
                    state.revealed = false;
                    this.gameStates.coreRecall = state;
                }
                if (state.index >= state.order.length) {
                    container.innerHTML = `
                        <div class="game-container">
                            <div class="game-header">
                                <div class="game-title">🧭 核心回忆 <small>本轮完成</small></div>
                                <button class="back-btn" id="coreRecallBackBtn">← 返回</button>
                            </div>
                            <div class="game-result">
                                <div class="big-score">${state.correct} / ${state.order.length}</div>
                                <div class="sub">本轮能回忆出核心感觉的单词数</div>
                                <button id="coreRecallRetryBtn">🔄 再来一轮</button>
                            </div>
                        </div>
                    `;
                    const backBtn = document.getElementById('coreRecallBackBtn');
                    if (backBtn) backBtn.addEventListener('click', () => this.leaveGame());
                    const retryBtn = document.getElementById('coreRecallRetryBtn');
                    if (retryBtn) retryBtn.addEventListener('click', () => {
                        delete this.gameStates.coreRecall;
                        this.renderCoreRecallGame();
                    });
                    return;
                }

                const word = this.words.find(w => w.id === state.order[state.index]);
                if (!word) {
                    state.index++;
                    this.renderCoreRecallGame();
                    return;
                }
                const core = word.core || {};
                const notes = word.wordNotes || [];
                const hasCore = !!core.feeling;
                const keywords = Array.isArray(core.keywords) ? core.keywords : [];
                const chain = Array.isArray(core.chain) ? core.chain : [];
                const progress = `${state.index + 1} / ${state.order.length}`;
                const missingHtml = `
                    <div class="core-recall-missing">
                        <div class="core-recall-missing-title">这个词还没有结构化核心感觉</div>
                        <div class="core-recall-missing-desc">旧版数据可能只存了释义。直接显示释义会违背“核心感觉”的用法，所以这里先不显示。</div>
                        <div class="core-recall-actions">
                            <button id="coreRecallSkipBtn">⏭ 跳过</button>
                            <button id="coreRecallLegacyBtn">📄 查看旧版笔记</button>
                            <button id="coreRecallFlagBtn">✏️ 标记待补充</button>
                        </div>
                        <div class="core-recall-legacy" id="coreRecallLegacy" style="display:none;">
                            <div class="core-recall-legacy-label">旧版笔记（仅参考，不是核心感觉）</div>
                            <div class="core-recall-legacy-text">${this.escapeHtml(notes[0] || '（无旧版笔记）')}</div>
                        </div>
                    </div>
                `;
                const bodyHtml = hasCore ? (!state.revealed ? `
                    <div class="core-recall-prompt">先在心里说出这个词的核心感觉 / 画面，再揭示答案。</div>
                    <div class="core-recall-reveal-wrap"><button id="coreRecallRevealBtn">👀 显示核心感觉</button></div>
                ` : `
                    <div class="core-recall-answer">
                        <div class="core-recall-feeling">${this.escapeHtml(core.feeling)}</div>
                        ${core.image ? `<div class="core-recall-image">🖼️ ${this.escapeHtml(core.image)}</div>` : ''}
                        ${keywords.length ? `<div class="core-recall-keywords">${keywords.map(k => `<span>${this.escapeHtml(k)}</span>`).join('')}</div>` : ''}
                        ${chain.length ? `<div class="core-recall-chain">${chain.map(n => `<span class="chain-node"><b>${this.escapeHtml(n.label || '')}</b><small>${this.escapeHtml(n.bridge || '')}</small></span>`).join('<span class="chain-arrow">→</span>')}</div>` : ''}
                    </div>
                    <div class="core-recall-actions">
                        <button data-grade="0">😵 忘记</button>
                        <button data-grade="1">🤔 模糊</button>
                        <button data-grade="2">✅ 记得</button>
                    </div>
                `) : missingHtml;
                let html = `
                    <div class="game-container core-recall-game">
                        <div class="game-header">
                            <div class="game-title">🧭 核心回忆 <small>先想感觉，再看答案</small></div>
                            <button class="back-btn" id="coreRecallBackBtn2">← 返回</button>
                        </div>
                        <div class="core-recall-word">${this.escapeHtml(word.word)}</div>
                        ${word.phonetic ? `<div class="core-recall-phonetic">${this.escapeHtml(word.phonetic)}</div>` : ''}
                        ${bodyHtml}
                        <div class="progress-info">进度：<span class="highlight">${progress}</span></div>
                    </div>
                `;
                container.innerHTML = html;

                const backBtn = document.getElementById('coreRecallBackBtn2');
                if (backBtn) backBtn.addEventListener('click', () => this.leaveGame());
                const coreGame = container.querySelector('.core-recall-game');
                if (coreGame) coreGame.addEventListener('click', (e) => {
                    if (state.revealed) return;
                    if (e.target && e.target.closest && e.target.closest('button')) return;
                    state.revealed = true;
                    this.renderCoreRecallGame();
                });
                const revealBtn = document.getElementById('coreRecallRevealBtn');
                if (revealBtn) revealBtn.addEventListener('click', () => {
                    state.revealed = true;
                    this.renderCoreRecallGame();
                });
                const advance = () => {
                    state.index++;
                    state.revealed = false;
                    this.renderCoreRecallGame();
                    this.renderList();
                };
                const skipBtn = document.getElementById('coreRecallSkipBtn');
                if (skipBtn) skipBtn.addEventListener('click', advance);
                const legacyBtn = document.getElementById('coreRecallLegacyBtn');
                if (legacyBtn) legacyBtn.addEventListener('click', () => {
                    const legacy = document.getElementById('coreRecallLegacy');
                    if (legacy) legacy.style.display = legacy.style.display === 'none' ? 'block' : 'none';
                });
                const flagBtn = document.getElementById('coreRecallFlagBtn');
                if (flagBtn) flagBtn.addEventListener('click', () => {
                    if (!word.core) word.core = {};
                    word.core.quality = 'needs-review';
                    this.saveData();
                    advance();
                });
                container.querySelectorAll('.core-recall-actions button[data-grade]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const grade = Number(btn.dataset.grade);
                        this.recordReview(word.id, grade === 2, null, grade);
                        if (grade === 2) state.correct = (state.correct || 0) + 1;
                        advance();
                    });
                });
            },

            // ============================================================
            //  近义辨析（0.2 新增）
            // ============================================================
            renderSynonymChallenge() {
                const container = document.getElementById('rightPanel');
                const groups = (this.extras.synonymGroups || []).filter(g =>
                    g && Array.isArray(g.members) && g.members.filter(m => m && m.word).length >= 2);
                if (groups.length === 0) {
                    container.innerHTML = `
                        <div class="game-container">
                            <div class="game-header">
                                <div class="game-title">⚖️ 近义辨析</div>
                                <button class="back-btn" id="synBackBtn">← 返回</button>
                            </div>
                            <div class="empty-review">
                                还没有可用的近义组。<br>
                                导入包含 <code>synonymGroups</code> 的 v2 数据后即可开始。<br>
                                <span style="font-size:13px;">当前近义组：${(this.extras.synonymGroups || []).length} 个</span>
                            </div>
                        </div>
                    `;
                    const back = document.getElementById('synBackBtn');
                    if (back) back.addEventListener('click', () => this.leaveGame());
                    return;
                }
                const state = this.gameStates.synonymChallenge || {};
                if (!state.initialized) {
                    state.questions = [];
                    state.index = 0;
                    state.score = 0;
                    state.finished = false;
                    state.showAnswer = false;
                    state.selected = '';
                    state.pendingTimeout = null;
                    const used = new Set();
                    for (let attempt = 0; attempt < 40 && state.questions.length < 10; attempt++) {
                        const group = groups[Math.floor(Math.random() * groups.length)];
                        const members = group.members.filter(m => m && m.word);
                        const target = members[Math.floor(Math.random() * members.length)];
                        const options = [];
                        const seen = new Set();
                        [target, ...members].forEach(m => {
                            const key = String(m.word).toLowerCase();
                            if (!seen.has(key) && options.length < 4) { seen.add(key); options.push(m.word); }
                        });
                        if (options.length < 2) continue;
                        for (let i = options.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [options[i], options[j]] = [options[j], options[i]];
                        }
                        const colls = Array.isArray(target.collocations) ? target.collocations :
                            (target.collocations ? [target.collocations] : []);
                        const coll = colls.find(c => String(c).toLowerCase().includes(String(target.word).toLowerCase()));
                        const promptType = coll ? 'collocation' : 'nuance';
                        const prompt = coll
                            ? String(coll).replace(new RegExp(this.escapeRegex(target.word), 'ig'), '_____')
                            : `哪个词的核心辨析是：${target.nuance || target.word}`;
                        const qKey = group.id + '|' + target.word.toLowerCase();
                        if (used.has(qKey)) continue;
                        used.add(qKey);
                        const linked = this.words.find(w => !w.deleted && w.word.toLowerCase() === String(target.word).toLowerCase());
                        state.questions.push({
                            groupId: group.id,
                            groupName: group.name || '近义组',
                            word: target.word,
                            wordId: linked ? linked.id : null,
                            promptType,
                            prompt,
                            options,
                            answer: target.word,
                            nuance: target.nuance || '',
                            mnemonic: group.mnemonic || ''
                        });
                    }
                    state.total = state.questions.length;
                    state.initialized = true;
                    this.gameStates.synonymChallenge = state;
                }

                if (state.finished || state.index >= state.total) {
                    const finalScore = state.score;
                    const total = state.total;
                    if (state.pendingTimeout) { clearTimeout(state.pendingTimeout);
                        state.pendingTimeout = null; }
                    container.innerHTML = `
                        <div class="game-container">
                            <div class="game-header">
                                <div class="game-title">⚖️ 近义辨析 <small>结果</small></div>
                                <button class="back-btn" id="synBackBtn">← 返回</button>
                            </div>
                            <div class="game-result">
                                <div class="big-score">${finalScore} / ${total}</div>
                                <div class="sub">正确率 ${total > 0 ? Math.round(finalScore / total * 100) : 0}%</div>
                                <button id="synRetryBtn">🔄 再来一局</button>
                            </div>
                        </div>
                    `;
                    const back = document.getElementById('synBackBtn');
                    if (back) back.addEventListener('click', () => this.leaveGame());
                    const retry = document.getElementById('synRetryBtn');
                    if (retry) retry.addEventListener('click', () => {
                        this.stopGameTimers();
                        delete this.gameStates.synonymChallenge;
                        this.renderSynonymChallenge();
                    });
                    return;
                }

                const q = state.questions[state.index];
                if (!q) { state.finished = true;
                    this.renderSynonymChallenge(); return; }
                const isAnswering = state.showAnswer;
                const feedback = isAnswering
                    ? `<div class="feedback-banner ${state.selected === q.answer ? 'correct' : 'wrong'}">
                        ${state.selected === q.answer ? '✅ 正确' : `❌ 正确答案：${this.escapeHtml(q.answer)}`}
                        ${q.nuance ? `<div style="margin-top:6px;font-size:13px;">${this.escapeHtml(q.nuance)}</div>` : ''}
                        ${q.mnemonic ? `<div style="margin-top:4px;font-size:12px;opacity:.8;">💡 ${this.escapeHtml(q.mnemonic)}</div>` : ''}
                    </div>`
                    : '';
                let html = `
                    <div class="game-container">
                        <div class="game-header">
                            <div class="game-title">⚖️ 近义辨析 <small>${this.escapeHtml(q.groupName)}</small></div>
                            <button class="back-btn" id="synBackBtn2">← 返回</button>
                        </div>
                        <div class="game-question" style="font-size:20px;line-height:1.6;">${q.promptType === 'collocation' ? this.escapeHtml(q.prompt) : this.escapeHtml(q.prompt)}</div>
                        <div style="text-align:center;color:#64748b;font-size:13px;margin-bottom:12px;">
                            ${q.promptType === 'collocation' ? '选出最适合填入空格的单词' : '根据核心辨析选出对应的单词'}
                        </div>
                        ${feedback}
                        <div class="game-options" style="max-width:560px;">
                            ${q.options.map(opt => {
                                let cls = '';
                                if (isAnswering) {
                                    if (opt === q.answer) cls = 'correct-answer';
                                    else if (opt === state.selected) cls = 'wrong-answer';
                                }
                                return `<button class="syn-option ${cls}" data-word="${this.escapeHtml(opt)}" ${isAnswering ? 'disabled' : ''}>${this.escapeHtml(opt)}</button>`;
                            }).join('')}
                        </div>
                        <div class="game-status">
                            <span>进度 ${state.index + 1}/${state.total}</span>
                            <span class="score">得分 ${state.score}</span>
                        </div>
                    </div>
                `;
                container.innerHTML = html;

                const back = document.getElementById('synBackBtn2');
                if (back) back.addEventListener('click', () => this.leaveGame());
                if (!isAnswering) {
                    container.querySelectorAll('.syn-option').forEach(btn => {
                        btn.addEventListener('click', () => {
                            if (state.showAnswer || state.finished) return;
                            const selected = btn.dataset.word;
                            const correct = selected === q.answer;
                            state.selected = selected;
                            state.showAnswer = true;
                            if (correct) state.score++;
                            if (q.wordId) this.recordReview(q.wordId, correct);
                            this.renderSynonymChallenge();
                            this.scheduleNext(() => {
                                if (!this.isGameActive('synonymChallenge')) return;
                                state.showAnswer = false;
                                state.selected = '';
                                state.index++;
                                if (state.index >= state.total) state.finished = true;
                                this.renderSynonymChallenge();
                            });
                        });
                    });
                }
            },

            // ============================================================
            //  词根拆解（0.2 新增）
            // ============================================================
            renderRootChallenge() {
                const container = document.getElementById('rightPanel');
                const candidates = this.words.filter(w => !w.deleted && w.morphology &&
                    Array.isArray(w.morphology.parts) &&
                    w.morphology.parts.some(p => p && p.form && p.meaning));
                if (candidates.length === 0) {
                    container.innerHTML = `
                        <div class="game-container">
                            <div class="game-header">
                                <div class="game-title">🌱 词根拆解</div>
                                <button class="back-btn" id="rootBackBtn">← 返回</button>
                            </div>
                            <div class="empty-review">
                                还没有可用的词根数据。<br>
                                导入包含 <code>morphology.parts</code> 的 v2 数据后即可开始。<br>
                                <span style="font-size:13px;">当前可拆解单词：0 个</span>
                            </div>
                        </div>
                    `;
                    const back = document.getElementById('rootBackBtn');
                    if (back) back.addEventListener('click', () => this.leaveGame());
                    return;
                }
                const state = this.gameStates.rootChallenge || {};
                if (!state.initialized) {
                    state.questions = [];
                    state.index = 0;
                    state.score = 0;
                    state.finished = false;
                    state.showAnswer = false;
                    state.selected = '';
                    state.pendingTimeout = null;
                    const uniq = arr => [...new Set(arr.filter(Boolean))];
                    const allMeanings = uniq(candidates.flatMap(w => (w.morphology.parts || [])
                        .map(p => p && p.meaning)));
                    const allLiterals = uniq(candidates.map(w => w.morphology.literal));
                    const familyGroups = this.extras.rootFamilies || [];
                    const allFamilyWords = uniq(familyGroups.flatMap(g => (g.members || [])
                        .map(m => m && m.word)));
                    const shuffle = arr => {
                        const a = [...arr];
                        for (let i = a.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [a[i], a[j]] = [a[j], a[i]];
                        }
                        return a;
                    };
                    const used = new Set();
                    for (let attempt = 0; attempt < 80 && state.questions.length < 10; attempt++) {
                        const w = candidates[Math.floor(Math.random() * candidates.length)];
                        const parts = (w.morphology.parts || []).filter(p => p && p.form && p.meaning);
                        if (parts.length === 0) continue;
                        const rootPart = parts.find(p => p.type === 'root') || parts[parts.length - 1];
                        const family = w.morphology.rootFamilyId
                            ? familyGroups.find(g => g.id === w.morphology.rootFamilyId) : null;
                        const partsText = parts.map(p => `${p.form}（${p.meaning}）`).join(' + ');
                        let q = null;

                        // 同根词题：有家族且家族里至少有一个非本词的成员
                        if (family && Array.isArray(family.members) && family.members.length >= 2 && Math.random() < 0.35) {
                            const correct = family.members.find(m => m && m.word &&
                                String(m.word).toLowerCase() !== String(w.word).toLowerCase());
                            if (correct) {
                                const options = shuffle(uniq([correct.word,
                                    ...family.members.map(m => m && m.word),
                                    ...allFamilyWords.filter(x => String(x).toLowerCase() !== String(w.word).toLowerCase())
                                ])).slice(0, 4);
                                if (options.length >= 2) {
                                    q = {
                                        type: 'family',
                                        word: w.word,
                                        prompt: `下面哪个词与「${w.word}」同根？`,
                                        options,
                                        answer: correct.word,
                                        explanation: `词根 ${family.root || rootPart.form} = ${family.meaning || rootPart.meaning}；${partsText}${w.morphology.literal ? `，字面义：${w.morphology.literal}` : ''}`,
                                        parts,
                                        wordId: w.id
                                    };
                                }
                            }
                        }

                        // 字面义题
                        if (!q && w.morphology.literal && allLiterals.length >= 2) {
                            const options = shuffle(uniq([w.morphology.literal, ...allLiterals])).slice(0, 4);
                            if (options.length >= 2) {
                                q = {
                                    type: 'literal',
                                    word: w.word,
                                    prompt: `「${w.word}」的词根字面义是？`,
                                    options,
                                    answer: w.morphology.literal,
                                    explanation: `${partsText}`,
                                    parts,
                                    wordId: w.id
                                };
                            }
                        }

                        // 词根含义题
                        if (!q && rootPart && allMeanings.length >= 2) {
                            const options = shuffle(uniq([rootPart.meaning, ...allMeanings])).slice(0, 4);
                            if (options.length >= 2) {
                                q = {
                                    type: 'meaning',
                                    word: w.word,
                                    prompt: `「${w.word}」中的词根「${rootPart.form}」是什么意思？`,
                                    options,
                                    answer: rootPart.meaning,
                                    explanation: `${partsText}${w.morphology.literal ? `；字面义：${w.morphology.literal}` : ''}`,
                                    parts,
                                    wordId: w.id
                                };
                            }
                        }

                        if (!q) continue;
                        const key = `${q.type}|${w.id}|${q.answer}`;
                        if (used.has(key)) continue;
                        used.add(key);
                        state.questions.push(q);
                    }
                    state.total = state.questions.length;
                    state.initialized = true;
                    this.gameStates.rootChallenge = state;
                }

                if (state.total === 0) {
                    container.innerHTML = `
                        <div class="game-container">
                            <div class="game-header">

            // ============================================================
            //  词义链 / 义项选择（0.2 新增）
            // ============================================================
            renderSenseChainGame() {
                const container = document.getElementById('rightPanel');
                const candidates = this.words.filter(w => !w.deleted &&
                    (w.senses || []).filter(s => s && s.definition).length >= 2);
                if (candidates.length === 0) {
                    container.innerHTML = `
                        <div class="game-container">
                            <div class="game-header">
                                <div class="game-title">🪜 词义链</div>
                                <button class="back-btn" id="senseBackBtn">← 返回</button>
                            </div>
                            <div class="empty-review">
                                需要至少 2 个义项的单词才能练习义项选择。<br>
                                导入含多义项的 v2 数据后再来。
                            </div>
                        </div>
                    `;
                    const back = document.getElementById('senseBackBtn');
                    if (back) back.addEventListener('click', () => this.leaveGame());
                    return;
                }
                const state = this.gameStates.senseChain || {};
                if (!state.initialized) {
                    state.questions = [];
                    state.index = 0;
                    state.score = 0;
                    state.finished = false;
                    state.showAnswer = false;
                    state.selected = '';
                    state.pendingTimeout = null;
                    const uniq = arr => [...new Set(arr.filter(Boolean))];
                    const allDefs = uniq(candidates.flatMap(w => (w.senses || [])
                        .map(s => s && s.definition)));
                    const shuffle = arr => {
                        const a = [...arr];
                        for (let i = a.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [a[i], a[j]] = [a[j], a[i]];
                        }
                        return a;
                    };
                    const used = new Set();
                    for (let attempt = 0; attempt < 120 && state.questions.length < 10; attempt++) {
                        const w = candidates[Math.floor(Math.random() * candidates.length)];
                        const senses = (w.senses || []).filter(s => s && s.definition);
                        if (senses.length < 2) continue;
                        const senseDefs = [...new Set(senses.map(s => s.definition).filter(Boolean))];
                        const otherDefs = allDefs.filter(d => !senseDefs.includes(d));
                        // 先放本词的全部义项；不足 4 个才补其他词的释义。
                        // 这样正确答案一定在选项里，也能完整看到一词多义。
                        const defOptions = (correct) => {
                            const picked = [...senseDefs];
                            if (correct && !picked.includes(correct)) picked.push(correct);
                            for (const d of shuffle(otherDefs)) {
                                if (picked.length >= 4) break;
                                if (!picked.includes(d)) picked.push(d);
                            }
                            return shuffle(picked);
                        };
                        let q = null;

                        // 例句义项题：例句里能找到这个词，挖空后问对应义项
                        const exampleSenses = senses.filter(s => s.example &&
                            new RegExp(this.escapeRegex(w.word), 'i').test(s.example));
                        if (exampleSenses.length) {
                            const sense = exampleSenses[Math.floor(Math.random() * exampleSenses.length)];
                            const options = defOptions(sense.definition);
                            if (options.length >= 2) {
                                q = {
                                    type: 'example',
                                    word: w.word,
                                    prompt: String(sense.example).replace(new RegExp(this.escapeRegex(w.word), 'ig'), '_____'),
                                    question: `这句话中的「${w.word}」对应哪个义项？`,
                                    options,
                                    answer: sense.definition,
                                    explanation: `${w.word} · ${sense.definition}`,
                                    chain: ((w.core && w.core.chain) || []).map(n => n.label).filter(Boolean),
                                    wordId: w.id,
                                    senseId: sense.id
                                };
                            }
                        }

                        // 词义链题：给链上的一个阶段，选对应义项
                        if (!q) {
                            const chain = ((w.core && w.core.chain) || []).filter(n => n && n.label);
                            for (const node of shuffle(chain)) {
                                let sense = null;
                                if (node.senseId !== undefined) {
                                    sense = senses.find(s => String(s.id) === String(node.senseId));
                                }
                                if (!sense) {
                                    const idx = (w.core.chain || []).indexOf(node);
                                    if (idx >= 0 && w.senses[idx] && w.senses[idx].definition) sense = w.senses[idx];
                                }
                                if (!sense) continue;
                                const options = defOptions(sense.definition);
                                if (options.length < 2) continue;
                                q = {
                                    type: 'chain',
                                    word: w.word,
                                    prompt: `从核心感觉「${(w.core && w.core.feeling) || ''}」出发，走到「${node.label}」这一步，对应哪个义项？`,
                                    question: '',
                                    options,
                                    answer: sense.definition,
                                    explanation: `${(w.core && w.core.chain || []).map(n => n.label).filter(Boolean).join(' → ')}`,
                                    chain: ((w.core && w.core.chain) || []).map(n => n.label).filter(Boolean),
                                    wordId: w.id,
                                    senseId: sense.id
                                };
                                break;
                            }
                        }

                        if (!q) continue;
                        const key = `${q.type}|${w.id}|${q.senseId}`;
                        if (used.has(key)) continue;
                        used.add(key);
                        state.questions.push(q);
                    }
                    state.total = state.questions.length;
                    state.initialized = true;
                    this.gameStates.senseChain = state;
                }

                if (state.total === 0) {
                    container.innerHTML = `
                        <div class="game-container">
                            <div class="game-header">
                                <div class="game-title">🪜 词义链</div>
                                <button class="back-btn" id="senseBackBtn">← 返回</button>
                            </div>
                            <div class="empty-review">多义项数据不足，暂时无法出题。</div>
                        </div>
                    `;
                    const back = document.getElementById('senseBackBtn');
                    if (back) back.addEventListener('click', () => this.leaveGame());
                    return;
                }

                if (state.finished || state.index >= state.total) {
                    const finalScore = state.score;
                    const total = state.total;
                    if (state.pendingTimeout) { clearTimeout(state.pendingTimeout);
                        state.pendingTimeout = null; }
                    container.innerHTML = `
                        <div class="game-container">
                            <div class="game-header">
                                <div class="game-title">🪜 词义链 <small>结果</small></div>
                                <button class="back-btn" id="senseBackBtn">← 返回</button>
                            </div>
                            <div class="game-result">
                                <div class="big-score">${finalScore} / ${total}</div>
                                <div class="sub">正确率 ${total > 0 ? Math.round(finalScore / total * 100) : 0}%</div>
                                <button id="senseRetryBtn">🔄 再来一局</button>
                            </div>
                        </div>
                    `;
                    const back = document.getElementById('senseBackBtn');
                    if (back) back.addEventListener('click', () => this.leaveGame());
                    const retry = document.getElementById('senseRetryBtn');
                    if (retry) retry.addEventListener('click', () => {
                        this.stopGameTimers();
                        delete this.gameStates.senseChain;
                        this.renderSenseChainGame();
                    });
                    return;
                }

                const q = state.questions[state.index];
                if (!q) { state.finished = true;
                    this.renderSenseChainGame(); return; }
                const isAnswering = state.showAnswer;
                const correct = state.selected === q.answer;
                const feedback = isAnswering
                    ? `<div class="feedback-banner ${correct ? 'correct' : 'wrong'}">
                        ${correct ? '✅ 正确' : `❌ 正确答案：${this.escapeHtml(q.answer)}`}
                        <div class="sense-explanation">${this.escapeHtml(q.explanation || '')}</div>
                    </div>`
                    : '';
                const chainHtml = (q.chain || []).length
                    ? `<div class="sense-chain">${q.chain.map(n => `<span>${this.escapeHtml(n)}</span>`).join('<b>→</b>')}</div>`
                    : '';
                let html = `
                    <div class="game-container">
                        <div class="game-header">
                            <div class="game-title">🪜 词义链 <small>义项选择</small></div>
                            <button class="back-btn" id="senseBackBtn2">← 返回</button>
                        </div>
                        <div class="core-recall-word" style="font-size:42px;margin:18px 0 4px;">${this.escapeHtml(q.word || '')}</div>
                        ${q.type === 'example' ? `<div class="sense-example">${this.escapeHtml(q.prompt)}</div><div class="game-question" style="font-size:17px;">${this.escapeHtml(q.question)}</div>` : `<div class="game-question" style="font-size:18px;line-height:1.7;">${this.escapeHtml(q.prompt)}</div>`}
                        ${chainHtml}
                        ${feedback}
                        <div class="sense-options">
                            ${q.options.map(opt => {
                                let cls = '';
                                if (isAnswering) {
                                    if (opt === q.answer) cls = 'correct-answer';
                                    else if (opt === state.selected) cls = 'wrong-answer';
                                }
                                return `<button class="sense-option ${cls}" data-definition="${this.escapeHtml(opt)}" ${isAnswering ? 'disabled' : ''}>${this.escapeHtml(opt)}</button>`;
                            }).join('')}
                        </div>
                        <div class="game-status">
                            <span>进度 ${state.index + 1}/${state.total}</span>
                            <span class="score">得分 ${state.score}</span>
                        </div>
                    </div>
                `;
                container.innerHTML = html;

                const back = document.getElementById('senseBackBtn2');
                if (back) back.addEventListener('click', () => this.leaveGame());
                if (!isAnswering) {
                    container.querySelectorAll('.sense-option').forEach(btn => {
                        btn.addEventListener('click', () => {
                            if (state.showAnswer || state.finished) return;
                            const selected = btn.dataset.definition;
                            const correctAnswer = selected === q.answer;
                            state.selected = selected;
                            state.showAnswer = true;
                            if (correctAnswer) state.score++;
                            this.recordReview(q.wordId, correctAnswer, q.senseId);
                            this.renderSenseChainGame();
                            this.scheduleNext(() => {
                                if (!this.isGameActive('senseChain')) return;
                                state.showAnswer = false;
                                state.selected = '';
                                state.index++;
                                if (state.index >= state.total) state.finished = true;

            },

            // ============================================================
            //  拼写挑战 (Spelling Challenge)
