            csvEscape(value) {
                const s = String(value == null ? '' : value);
                return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
            },
            toCSV() {
                const headers = ['word', 'phonetic', 'core', 'senses', 'examples', 'synonyms',
                    'collocations', 'pitfall', 'level', 'topic', 'pos', 'mastery', 'reviewCount',
                    'correctCount', 'addedDate', 'lastReviewDate', 'deleted'];
                const rows = this.words.map(w => {
                    const senses = w.senses || [];
                    return [
                        w.word, w.phonetic || '', (w.core && w.core.feeling) || '',
                        senses.map(s => s.definition || '').filter(Boolean).join(' | '),
                        senses.map(s => s.example || '').filter(Boolean).join(' | '),
                        senses.map(s => s.synonyms || '').filter(Boolean).join(' | '),
                        senses.map(s => s.collocations || '').filter(Boolean).join(' | '),
                        senses.map(s => s.pitfall || '').filter(Boolean).join(' | '),
                        (senses[0] && senses[0].level) || '', (senses[0] && senses[0].topic) || '',
                        (senses[0] && senses[0].pos) || '', w.mastery || '',
                        w.reviewCount || 0, w.correctCount || 0,
                        w.addedDate ? new Date(w.addedDate).toISOString() : '',
                        w.lastReviewDate ? new Date(w.lastReviewDate).toISOString() : '',
                        w.deleted ? 'true' : 'false'
                    ].map(v => this.csvEscape(v)).join(',');
                });
                return '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
            },
            toMarkdown() {
                const lines = ['# 智能单词本导出', '', `> 导出时间：${new Date().toLocaleString()}`, ''];
                this.words.forEach(w => {
                    lines.push(`## ${w.word}`);
                    if (w.phonetic) lines.push(`- 音标：${w.phonetic}`);
                    if (w.core && w.core.feeling) lines.push(`- 核心感觉：${w.core.feeling}`);
                    if (w.core && w.core.image) lines.push(`- 画面：${w.core.image}`);
                    if (w.morphology && w.morphology.literal) lines.push(`- 词根字面义：${w.morphology.literal}`);
                    if (w.etymology && w.etymology.story) lines.push(`- 词源：${w.etymology.story}`);
                    if (w.senses && w.senses.length) {
                        lines.push('- 义项：');
                        w.senses.forEach((s, i) => {
                            lines.push(`  ${i + 1}. ${s.definition || '（空）'}`);
                            if (s.example) lines.push(`     - 例句：${s.example}`);
                            if (s.synonyms) lines.push(`     - 近义：${s.synonyms}`);
                            if (s.collocations) lines.push(`     - 搭配：${s.collocations}`);
                            if (s.pitfall) lines.push(`     - 易错：${s.pitfall}`);
                        });
                    }
                    (w.wordNotes || []).filter(Boolean).forEach(n => lines.push(`- 笔记：${n}`));
                    lines.push('');
                });
                return lines.join('\n');
            },
            toTXT() {
                return this.words.map(w => w.word).filter(Boolean).join('\n') + '\n';
            },
            downloadFile(content, filename, mime) {
                if (window.desktop && typeof window.desktop.saveTextFile === 'function') {
                    const kind = (filename.split('.').pop() || 'txt').toLowerCase();
                    window.desktop.saveTextFile({ content, defaultName: filename, kind })
                        .then(result => {
                            if (result && result.ok) {
                                this.showToast(`✅ 已保存到 ${result.filePath}`, 'success', 3500);
                            } else if (result && result.canceled) {
                                this.showToast('已取消保存', 'info');
                            }
                        })
                        .catch(err => this.showToast('❌ 保存失败：' + err.message, 'error'));
                    return true;
                }
                const blob = new Blob([content], { type: mime });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                return false;
            },
            exportAs(format) {
                if (this.words.length === 0) {
                    this.showToast('⚠️ 没有数据可导出', 'error');
                    return;
                }
                const dateStr = new Date().toISOString().slice(0, 10);
                try {
                    let nativeSave = false;
                    if (format === 'json') {
                        const data = this.buildExportData();
                        nativeSave = this.downloadFile(JSON.stringify(data, null, 2),
                            `单词本备份_${dateStr}.json`, 'application/json;charset=utf-8');
                    } else if (format === 'csv') {
                        nativeSave = this.downloadFile(this.toCSV(), `单词本表格_${dateStr}.csv`,
                            'text/csv;charset=utf-8');
                    } else if (format === 'md') {
                        nativeSave = this.downloadFile(this.toMarkdown(), `单词本笔记_${dateStr}.md`,
                            'text/markdown;charset=utf-8');
                    } else if (format === 'txt') {
                        nativeSave = this.downloadFile(this.toTXT(), `单词表_${dateStr}.txt`,
                            'text/plain;charset=utf-8');
                    } else {
                        return;
                    }
                    this.closeExportModal();
                    if (!nativeSave) {
                        this.showToast(`✅ 已导出 ${this.words.length} 个单词（${format.toUpperCase()}）`, 'success');
                    }
                } catch (err) {
                    this.showToast('❌ 导出失败：' + err.message, 'error');
                    console.error(err);
                }
            },
            readFileText(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(String(e.target.result || ''));
                    reader.onerror = () => reject(reader.error || new Error('读取失败'));
                    reader.readAsText(file);
                });
            },
            parseCSV(text) {
                text = String(text || '').replace(/^\uFEFF/, '');
                const rows = [];
                let row = [], cell = '', quoted = false;
                for (let i = 0; i < text.length; i++) {
                    const ch = text[i];
                    if (quoted) {
                        if (ch === '"') {
                            if (text[i + 1] === '"') { cell += '"'; i++; }
                            else quoted = false;
                        } else cell += ch;
                    } else if (ch === '"') {
                        quoted = true;
                    } else if (ch === ',') {
                        row.push(cell); cell = '';
                    } else if (ch === '\n' || ch === '\r') {
                        if (ch === '\r' && text[i + 1] === '\n') i++;
                        row.push(cell); cell = '';
                        if (row.some(c => c.trim() !== '')) rows.push(row);
                        row = [];
                    } else {
                        cell += ch;
                    }
                }
                row.push(cell);
                if (row.some(c => c.trim() !== '')) rows.push(row);
                return rows;
            },
            parseImportText(fileName, text) {
                const lower = fileName.toLowerCase();
                const emptyExtras = { rootFamilies: [], synonymGroups: [], confusionPairs: [] };
                if (lower.endsWith('.json')) {
                    const data = JSON.parse(text);
                    if (!data || !Array.isArray(data.words)) throw new Error('缺少 words 数组');
                    return {
                        words: data.words,
                        extras: {
                            rootFamilies: Array.isArray(data.rootFamilies) ? data.rootFamilies : [],
                            synonymGroups: Array.isArray(data.synonymGroups) ? data.synonymGroups : [],
                            confusionPairs: Array.isArray(data.confusionPairs) ? data.confusionPairs : []
                        },
                        progress: Array.isArray(data.progress) ? data.progress : [],
                        decks: Array.isArray(data.decks) ? data.decks : [],
                        deckWords: Array.isArray(data.deckWords) ? data.deckWords : []
                    };
                }
                if (lower.endsWith('.csv')) {
                    const rows = this.parseCSV(text);
                    if (rows.length < 2) return { words: [], extras: emptyExtras };
                    const headers = rows[0].map(h => h.trim().toLowerCase());
                    const idx = name => headers.indexOf(name);
                    const wordIdx = idx('word');
                    if (wordIdx === -1) throw new Error('CSV 缺少 word 列');
                    const words = rows.slice(1).map(r => {
                        const word = (r[wordIdx] || '').trim();
                        if (!word) return null;
                        const sense = {
                            id: this.genId(),
                            definition: r[idx('senses')] || r[idx('definition')] || '',
                            example: r[idx('examples')] || r[idx('example')] || '',
                            synonyms: r[idx('synonyms')] || '',
                            collocations: r[idx('collocations')] || '',
                            pitfall: r[idx('pitfall')] || '',
                            level: r[idx('level')] || '',
                            topic: r[idx('topic')] || '',
                            pos: r[idx('pos')] || '',
                            tone: '', origin: '', formality: '', grammar: '', notes: ['']
                        };
                        return {
                            word,
                            phonetic: r[idx('phonetic')] || '',
                            core: { feeling: r[idx('core')] || '', image: '', keywords: [], chain: [] },
                            senses: [sense],
                            mastery: r[idx('mastery')] || 'unknown',
                            reviewCount: Number(r[idx('reviewcount')]) || 0,
                            correctCount: Number(r[idx('correctcount')]) || 0,
                            addedDate: Date.parse(r[idx('addeddate')]) || Date.now(),
                            lastReviewDate: Date.parse(r[idx('lastreviewdate')]) || Date.now(),
                            deleted: String(r[idx('deleted')] || '').toLowerCase() === 'true'
                        };
                    }).filter(Boolean);
                    return { words, extras: emptyExtras };
                }
                // .txt / 无扩展名：一行一个单词
                const words = text.split(/\r?\n/).map(line => line.split('\t')[0].trim())
                    .filter(Boolean).map(word => ({
                        word,
                        senses: [{
                            id: this.genId(), definition: '', example: '', synonyms: '',
                            collocations: '', pitfall: '', tone: '', topic: '', pos: '', level: '',
                            origin: '', formality: '', grammar: '', notes: ['']
                        }],
                        mastery: 'unknown', addedDate: Date.now(), lastReviewDate: Date.now(),
                        deleted: false
                    }));
                return { words, extras: emptyExtras };
            },
            mergeExtras(target, source) {
                const memberKey = (m) => {
                    if (!m) return '';
                    if (m.word) return 'w:' + String(m.word).toLowerCase();
                    if (m.a || m.b) return 'p:' + String(m.a || '') + '|' + String(m.b || '');
                    return JSON.stringify(m);
                };
                const mergeMembers = (a, b) => {
                    const out = [...(Array.isArray(a) ? a : [])];
                    const seen = new Set(out.map(memberKey));
                    (Array.isArray(b) ? b : []).forEach(m => {
                        const k = memberKey(m);
                        if (k && !seen.has(k)) { seen.add(k); out.push(m); }
                    });
                    return out;
                };
                ['rootFamilies', 'synonymGroups', 'confusionPairs'].forEach(key => {
                    const map = new Map((target[key] || []).map(x => [x.id, x]));
                    (source[key] || []).forEach(raw => {
                        if (!raw || !raw.id) return;
                        const item = JSON.parse(JSON.stringify(raw));
                        const existing = map.get(item.id);
                        if (!existing) { map.set(item.id, item); return; }
                        existing.members = mergeMembers(existing.members, item.members);
                        if (key === 'synonymGroups') {
                            existing.contrasts = mergeMembers(existing.contrasts, item.contrasts);
                            existing.dimensions = (existing.dimensions && existing.dimensions.length) ? existing.dimensions : (item.dimensions || []);
                            existing.mnemonic = existing.mnemonic || item.mnemonic || '';
                        }
                        if (key === 'rootFamilies') {
                            existing.meaning = existing.meaning || item.meaning || '';
                            existing.origin = existing.origin || item.origin || '';
                            existing.mnemonic = existing.mnemonic || item.mnemonic || '';
                        }
                    });
                    target[key] = [...map.values()];
                });
                return target;
            },
            async importFiles(files, options = {}) {
                if (!files || files.length === 0) return;
                const allWords = [];
                const allExtras = { rootFamilies: [], synonymGroups: [], confusionPairs: [] };
                const allProgress = [];
                const deckMap = new Map();
                const allDeckWords = [];
                const fileNames = [];
                let skipped = 0;
                let failedFiles = 0;
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    try {
                        this.showToast(`📥 读取 ${i + 1}/${files.length}：${file.name}`, 'info', 1000);
                        const text = await this.readFileText(file);
                        const parsed = this.parseImportText(file.name, text);
                        allWords.push(...(parsed.words || []));
                        this.mergeExtras(allExtras, parsed.extras || {});
                        if (Array.isArray(parsed.progress)) allProgress.push(...parsed.progress);
                        (parsed.decks || []).forEach(d => { if (d && d.id) deckMap.set(d.id, d); });
                        if (Array.isArray(parsed.deckWords)) allDeckWords.push(...parsed.deckWords);
                        fileNames.push(file.name);
                    } catch (err) {
                        failedFiles++;
                        console.error(err);
                        this.showToast(`⚠️ ${file.name} 解析失败：${err.message}`, 'error', 3000);
                    }
                }
                const deckPlan = {
                    mode: options.mode || 'normal',
                    newDeckName: options.newDeckName || '',
                    targetDeckId: options.targetDeckId || null,
                    sourceDecks: [...deckMap.values()],
                    sourceDeckWords: allDeckWords,
                    fileNames
                };
                this.startImport(allWords, files.length, failedFiles, skipped, allExtras, allProgress, deckPlan);
            },
            startImport(rawWords, fileCount, failedFiles, skipped, extrasToImport, progressToImport, deckPlan) {
                const activeWords = this.words.filter(w => !w.deleted);
                const activeMap = new Map(activeWords.map(w => [w.word.toLowerCase(), w]));
                const conflicts = [];
                const nonConflictWords = [];
                const seen = new Set();
                for (const rawWord of rawWords) {
                    if (!rawWord || typeof rawWord.word !== 'string' || !rawWord.word.trim()) {
                        skipped++;
                        continue;
                    }
                    const key = rawWord.word.trim().toLowerCase();
                    if (seen.has(key)) { skipped++; continue; }
                    seen.add(key);
                    let migrated;
                    try {
                        migrated = this.migrateWord({ ...rawWord, word: rawWord.word.trim() });
                    } catch (err) { skipped++; continue; }
                    if (!migrated.senses || migrated.senses.length === 0) { skipped++; continue; }
                    const existing = activeMap.get(key);
                    if (existing) conflicts.push({ imported: migrated, existing });
                    else nonConflictWords.push(migrated);
                }
                const skippedMsg = skipped > 0 ? `，跳过 ${skipped} 条无效/重复记录` : '';
                const failedMsg = failedFiles > 0 ? `，${failedFiles} 个文件解析失败` : '';
                const groupCount = ['rootFamilies', 'synonymGroups', 'confusionPairs']
                    .reduce((n, k) => n + ((extrasToImport && extrasToImport[k]) ? extrasToImport[k].length : 0), 0);
                if (nonConflictWords.length === 0 && conflicts.length === 0 && groupCount === 0) {
                    this.showToast('⚠️ 没有可导入的有效单词', 'error');
                    return;
                }
                this.importSkipped = skipped;
                if (conflicts.length > 0) {
                    this.importConflictData = {
                        conflicts, nonConflictWords,
                        skippedCount: skipped, fileCount,
                        failedFiles, extrasToImport, progressToImport, deckPlan
                    };
                    this.showConflictModal();
                    return;
                }
                if (!confirm(`将导入 ${nonConflictWords.length} 个单词、${groupCount} 组词根/近义数据（来自 ${fileCount} 个文件）${skippedMsg}${failedMsg}。\n确定继续吗？`)) return;
                this.doImport(nonConflictWords, null, extrasToImport, progressToImport, deckPlan);
            },
            assignImportedDecks(newWords, oldIdMap, plan) {
                const fallback = (id) => id && this.decks.some(d => d.id === id && !d.readOnly) ? id : this.defaultDeckId();
                const targetId = plan && plan.targetDeckId ? fallback(plan.targetDeckId) : null;
                const currentId = this.activeDeckId !== 'all' ? fallback(this.activeDeckId) : null;
                if (!plan || plan.mode === 'existing') {
                    const id = targetId || currentId || this.defaultDeckId();
                    if (id) newWords.forEach(w => this.deckWords.add(this.deckKey(id, w.id)));
                    return;
                }
                if (plan.mode === 'new') {
                    let base = (plan.newDeckName || '').trim() ||
                        (plan.sourceDecks && plan.sourceDecks[0] && plan.sourceDecks[0].name) ||
                        ((plan.fileNames && plan.fileNames[0]) ? plan.fileNames[0].replace(/\.[^.]+$/, '') : '') ||
                        '导入词库';
                    let name = base;
                    let n = 2;
                    while (this.decks.some(d => d.name === name)) name = `${base} (${n++})`;
                    const now = Date.now();
                    const deck = { id: `deck-${now}-${Math.random().toString(36).slice(2, 6)}`, name,
                        kind: 'user', readOnly: false, createdAt: now, updatedAt: now };
                    this.decks.push(deck);
                    newWords.forEach(w => this.deckWords.add(this.deckKey(deck.id, w.id)));
                    return;
                }

                // normal：优先按 JSON 里的词库归属导入
                const sourceDecks = plan.sourceDecks || [];
                const sourceDeckWords = plan.sourceDeckWords || [];
                const deckIdMap = new Map();
                sourceDecks.forEach(sd => {
                    if (!sd || !sd.id) return;
                    let existing = this.decks.find(d => d.id === sd.id) ||
                        this.decks.find(d => d.name === sd.name);
                    if (!existing) {
                        let id = sd.id;
                        if (this.decks.some(d => d.id === id)) id = `deck-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
                        existing = { ...sd, id, readOnly: false, kind: sd.kind || 'user', updatedAt: Date.now() };
                        this.decks.push(existing);
                    }
                    deckIdMap.set(sd.id, existing.id);
                });
                const assigned = new Set();
                sourceDeckWords.forEach(record => {
                    if (!record) return;
                    let deckId = record.deckId;
                    let wordId = record.wordId;
                    if ((!deckId || wordId === undefined) && record.key) {
                        const i = String(record.key).lastIndexOf(':');
                        if (i > 0) { deckId = String(record.key).slice(0, i); wordId = String(record.key).slice(i + 1); }
                    }
                    const localDeck = deckIdMap.get(deckId);
                    const localWord = oldIdMap.get(String(wordId));
                    if (localDeck && localWord) {
                        this.deckWords.add(this.deckKey(localDeck, localWord));
                        assigned.add(localWord);
                    }
                });
                const fallbackId = currentId || this.defaultDeckId();
                if (fallbackId) newWords.forEach(w => {
                    if (!assigned.has(w.id)) this.deckWords.add(this.deckKey(fallbackId, w.id));
                });
            },

            doImport(wordsToImport, conflictResolutions, extrasToImport, progressToImport, deckPlan) {
                this.pushUndo('导入单词');
                const targetDeckId = this.activeDeckId !== 'all' ? this.activeDeckId : this.defaultDeckId();
                if (conflictResolutions) {
                    for (const resolution of conflictResolutions) {
                        if (resolution.action !== 'overwrite') continue;
                        const idx = this.words.findIndex(w => w.id === resolution.existingId);
                        if (idx === -1) continue;
                        const old = this.words[idx];
                        const newWord = resolution.importedWord;
                        newWord.id = resolution.existingId;
                        newWord.addedDate = old.addedDate;
                        newWord.lastReviewDate = old.lastReviewDate;
                        newWord.reviewCount = old.reviewCount || 0;
                        newWord.correctCount = old.correctCount || 0;
                        newWord.deleted = false;
                        this.words[idx] = newWord;
                        if (targetDeckId) this.deckWords.add(this.deckKey(targetDeckId, newWord.id));
                    }
                }
                const newWords = [];
                const oldIdMap = new Map();
                for (const w of wordsToImport) {
                    const oldWordId = w.id;
                    w.id = this.genId();
                    if (oldWordId !== undefined) oldIdMap.set(String(oldWordId), w.id);
                    const senseIdMap = {};
                    w.senses = w.senses.map(s => {
                        const oldId = s.id;
                        s.id = this.genId();
                        if (oldId !== undefined) senseIdMap[oldId] = s.id;
                        return s;
                    });
                    if (w.core && Array.isArray(w.core.chain)) {
                        w.core.chain.forEach(node => {
                            if (node.senseId !== undefined && senseIdMap[node.senseId] !== undefined) {
                                node.senseId = senseIdMap[node.senseId];
                            }
                        });
                    }
                    if (!w.wordNotes) w.wordNotes = [];
                    w.deleted = false;
                    newWords.push(w);
                }
                this.words.push(...newWords);
                this.assignImportedDecks(newWords, oldIdMap, deckPlan);
                if (extrasToImport) this.mergeExtras(this.extras, extrasToImport);
                if (Array.isArray(progressToImport)) {
                    progressToImport.forEach(p => {
                        if (!p || !p.key) return;
                        const existing = this.progress.get(p.key);
                        if (!existing || (p.lastReviewedAt || 0) >= (existing.lastReviewedAt || 0)) {
                            this.progress.set(p.key, p);
                        }
                    });
                }
                this.searchIndex.rebuild(this.words);
                this.saveData();
                this.render();
                const totalImported = newWords.length + (conflictResolutions ? conflictResolutions.filter(r =>
                    r.action === 'overwrite').length : 0);
                const skipped = this.importSkipped || (this.importConflictData ? (this.importConflictData.skippedCount || 0) : 0);
                const skipMsg = skipped > 0 ? `，跳过 ${skipped} 条` : '';
                this.showToast(`✅ 成功导入 ${totalImported} 个单词${skipMsg}`, 'success');
                this.importSkipped = 0;
                this.importConflictData = null;
            },
            showConflictModal() {
                const overlay = document.getElementById('conflictModalOverlay');
                const container = document.getElementById('conflictListContainer');
                if (!this.importConflictData || !container) return;
                container.innerHTML = '';
                this.importConflictData.conflicts.forEach((conflict, idx) => {
                    const item = document.createElement('div');
                    item.className = 'conflict-item';
                    item.dataset.index = idx;
                    item.dataset.action = '';
                    const existingDef = conflict.existing.senses[0]?.definition || '（无释义）';
                    const importedDef = conflict.imported.senses[0]?.definition || '（无释义）';
                    item.innerHTML =
                        `<div class="conflict-word">${this.escapeHtml(conflict.imported.word)}</div><div class="conflict-existing"><div>现有：${this.escapeHtml(existingDef.slice(0, 60))}${existingDef.length > 60 ? '…' : ''}</div><div class="existing-def">导入：${this.escapeHtml(importedDef.slice(0, 60))}${importedDef.length > 60 ? '…' : ''}</div></div><div class="conflict-choices"><button class="choice-overwrite" data-index="${idx}" data-action="overwrite">🔄 覆盖</button><button class="choice-skip" data-index="${idx}" data-action="skip">⏭ 跳过</button></div>`;
                    container.appendChild(item);
                });
                container.querySelectorAll('.choice-overwrite, .choice-skip').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = Number(this.dataset.index);
                        const action = this.dataset.action;
                        const item = container.children[idx];
                        item.dataset.action = action;
                        item.querySelectorAll('.choice-overwrite, .choice-skip').forEach(b => b.classList
                            .remove('selected-overwrite', 'selected-skip'));
                        if (action === 'overwrite') this.classList.add('selected-overwrite');
                        else this.classList.add('selected-skip');
                    });
                });
                overlay.classList.add('show');
            },
            hideConflictModal() {
                const overlay = document.getElementById('conflictModalOverlay');
                if (overlay) overlay.classList.remove('show');
            },
            confirmConflictImport() {
                if (!this.importConflictData) return;
                const container = document.getElementById('conflictListContainer');
                const items = container.querySelectorAll('.conflict-item');
                const resolutions = [];
                let unresolved = 0;
                items.forEach((item, idx) => {
                    const action = item.dataset.action;
                    if (!action) { unresolved++; return; }
                    const conflict = this.importConflictData.conflicts[idx];
                    resolutions.push({ action: action, existingId: conflict.existing.id, importedWord: conflict
                            .imported });
                });
                if (unresolved > 0) { alert(`还有 ${unresolved} 个冲突未处理，请为每个冲突选择「覆盖」或「跳过」。`); return; }
                this.hideConflictModal();
                this.doImport(this.importConflictData.nonConflictWords, resolutions,
                    this.importConflictData.extrasToImport, this.importConflictData.progressToImport,
                    this.importConflictData.deckPlan);
            },

                    if (!editable && (e.ctrlKey || e.metaKey) && !e.altKey) {
                        const key = e.key.toLowerCase();
                        if (key === 'z' && !e.shiftKey) { e.preventDefault();
                            App.undo(); return; }
                        if (key === 'y' || (key === 'z' && e.shiftKey)) { e.preventDefault();

                            input.blur();
                        } else {
                            const form = document.getElementById('addWordForm');
                            if (form && form.classList.contains('open')) App.toggleAddWordForm(false);
                            else if (App.searchQuery) App.clearSearch();
                        }
                    }
                    if ((App.currentMode === 'dictionary' || App.currentMode === 'recycle') && (e.key ===
                            'ArrowLeft' || e.key === 'ArrowRight')) {
                        e.preventDefault();
                        App.navigateWord(e.key === 'ArrowLeft' ? -1 : 1);
                    }
                    if (!editable && !e.ctrlKey && !e.metaKey && !e.altKey && e.key !== 'Escape' && e.key !== 'Tab') {
                        const coreState = App.gameStates.coreRecall;
                        if (App.currentMode === 'review' && App.currentGame === 'coreRecall' && coreState && !coreState.revealed) {
                            e.preventDefault();
                            coreState.revealed = true;
                            App.renderRightPanel();
                            return;
                        }
                        if (App.currentMode === 'dailyReview' && App.dailySession && !App.dailySession.revealed) {
                            e.preventDefault();
                            App.dailySession.revealed = true;
                            App.renderRightPanel();
                            return;
                        }
                    }
                    if (App.currentMode === 'review' && App.currentGame === 'flashcard' && (e.key === ' ' || e.key === 'Enter')) {
                        e.preventDefault();
                        App.flashcardFlipped = !App.flashcardFlipped;
                        App.renderRightPanel();
                    }
                });

                const persist = () => { this.flushSave(); };
                window.addEventListener('pagehide', persist);
                window.addEventListener('beforeunload', persist);
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden') this.flushSave();
                });
            },

            escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },
            escapeRegex(str) { return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
