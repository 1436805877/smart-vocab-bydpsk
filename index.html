                });
            },

            buildExportData() {
                return {
                    app: '智能单词本',
                    appVersion: '0.3.3',
                    schemaVersion: 3,
                    exportedAt: new Date().toISOString(),
                    wordCount: this.words.length,
                    words: this.words,
                    rootFamilies: this.extras.rootFamilies || [],
                    synonymGroups: this.extras.synonymGroups || [],
                    confusionPairs: this.extras.confusionPairs || [],
                    progress: [...this.progress.values()],
                    decks: this.decks,
                    deckWords: [...this.deckWords].map(key => {
                        const i = key.lastIndexOf(':');
                        return { key, deckId: key.slice(0, i), wordId: Number(key.slice(i + 1)) };
                    })
                };
            },

            backupFileName(date = new Date()) {
                const pad = n => String(n).padStart(2, '0');
                return `wordbook-backup-${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}-${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}.json`;
            },

            async createBackup(reason = 'manual') {
                if (!this.words.length) {
                    if (reason === 'manual') this.showToast('没有可备份的数据', 'info');
                    return null;
                }
                const data = this.buildExportData();
                const now = Date.now();
                const snapshot = {
                    id: `${now}-${Math.random().toString(36).slice(2, 8)}`,
                    createdAt: now,
                    reason,
                    wordCount: this.words.length,
                    progressCount: this.progress.size,
                    data
                };
                try {
                    await this.db.saveBackup(snapshot);
                    const all = (await this.db.getBackups()).sort((a, b) => b.createdAt - a.createdAt);
                    for (const old of all.slice(7)) await this.db.deleteBackup(old.id);
                    this.backups = all.slice(0, 7);
                    this.lastBackupAt = now;
                } catch (e) {
                    console.error('Backup failed:', e);
                    if (reason === 'manual') this.showToast('备份失败：' + e.message, 'error');
                    return null;
                }
                if (window.desktop && typeof window.desktop.saveBackup === 'function') {
                    try {
                        await window.desktop.saveBackup(JSON.stringify(data, null, 2), this.backupFileName());
                    } catch (e) {
                        console.error('Desktop backup failed:', e);
                    }
                }
                if (reason === 'manual') this.showToast('✅ 备份完成', 'success');
                return snapshot;
            },

            async autoBackupIfNeeded() {
                if (!this.words.length) return;
                try {
                    const all = (await this.db.getBackups()).sort((a, b) => b.createdAt - a.createdAt);
                    this.backups = all;
                    if (all.length && Date.now() - all[0].createdAt < 12 * 3600 * 1000) {
                        this.lastBackupAt = all[0].createdAt;
                        return;
                    }
                    await this.createBackup('auto');
                } catch (e) {
                    console.error('Auto backup failed:', e);
                }
            },

            async refreshBackupList() {
                try {
                    const all = await this.db.getBackups();
                    this.backups = all.sort((a, b) => b.createdAt - a.createdAt);
                } catch (e) { this.backups = []; }
                if (window.desktop && typeof window.desktop.listBackups === 'function') {
                    try {
                        const res = await window.desktop.listBackups();
                        this.fileBackups = (res && res.files) || [];
                    } catch (e) { this.fileBackups = []; }
                } else {
                    this.fileBackups = [];
                }
            },

            async restoreFromData(data, label = '备份') {
                if (!data || !Array.isArray(data.words) || data.words.length === 0) {
                    this.showToast('备份文件没有有效单词', 'error');
                    return false;
                }
                this.pushUndo('恢复备份');
                await this.createBackup('before-restore');
                const restored = [];
                for (const raw of data.words) {
                    try {
                        const w = this.migrateWord(JSON.parse(JSON.stringify(raw)));
                        if (w && w.word && w.senses && w.senses.length) restored.push(w);
                    } catch (e) { /* skip broken */ }
                }
                if (!restored.length) {
                    this.showToast('备份恢复失败：没有可用单词', 'error');
                    return false;
                }
                this.words = restored;
                this.extras = {
                    rootFamilies: Array.isArray(data.rootFamilies) ? data.rootFamilies : [],
                    synonymGroups: Array.isArray(data.synonymGroups) ? data.synonymGroups : [],
                    confusionPairs: Array.isArray(data.confusionPairs) ? data.confusionPairs : []
                };
                this.progress = new Map((Array.isArray(data.progress) ? data.progress : [])
                    .filter(p => p && p.key).map(p => [p.key, p]));
                this.progress.forEach(p => {
                    if (p.wrongCount > 0 && p.wrongActive === undefined) p.wrongActive = true;
                    if (typeof p.consecutiveCorrect !== 'number') p.consecutiveCorrect = 0;
                });
                if (Array.isArray(data.decks) && data.decks.length) {
                    this.decks = data.decks.filter(d => d && d.id).map(d => ({ ...d }));
                    this.deckWords = new Set((Array.isArray(data.deckWords) ? data.deckWords : [])
                        .filter(r => r && r.key).map(r => r.key));
                    const missing = this.words.filter(w => !this.decks.some(d =>
                        this.deckWords.has(this.deckKey(d.id, w.id))));
                    const defaultDeck = this.decks.find(d => d.id === 'default') || this.decks[0];
                    missing.forEach(w => this.deckWords.add(this.deckKey(defaultDeck.id, w.id)));
                } else {
                    const now = Date.now();
                    this.decks = [{ id: 'default', name: '我的词库', kind: 'user', readOnly: false, createdAt: now, updatedAt: now }];
                    this.deckWords = new Set(this.words.map(w => this.deckKey('default', w.id)));
                }
                this.activeDeckId = 'all';
                this.decksLoaded = true;
                this.seedIdSequence();
                this.buildIndex();
                this.currentWordId = this.words[0] ? this.words[0].id : null;
                this.currentSenseId = null;
                this.currentMode = 'dictionary';
                this.currentGame = null;
                this.dailySession = null;
                await this.saveData(true);
                this.render();
                this.showToast(`✅ 已从${label}恢复 ${restored.length} 个单词`, 'success');
                return true;
            },

            async restoreSnapshot(id) {
                const snap = this.backups.find(x => x.id === id);
                if (!snap) { this.showToast('找不到这个备份', 'error'); return; }
                if (!confirm(`将用 ${new Date(snap.createdAt).toLocaleString()} 的备份覆盖当前数据。\n恢复前会自动备份当前数据。确定继续吗？`)) return;
                await this.restoreFromData(snap.data, '备份');
            },

            async restoreDesktopFile(name) {
                if (!window.desktop || typeof window.desktop.readBackup !== 'function') return;
                try {
                    const res = await window.desktop.readBackup(name);
                    if (!res || !res.ok) throw new Error(res && res.error || '读取失败');
                    const data = JSON.parse(res.text);
                    if (!confirm(`将从本地文件「${name}」恢复，覆盖当前数据。\n恢复前会自动备份当前数据。确定继续吗？`)) return;
                    await this.restoreFromData(data, '本地备份');
                } catch (e) {
                    this.showToast('读取备份失败：' + e.message, 'error');
                }
            },

            async deleteSnapshot(id) {
                if (!confirm('确定删除这个备份吗？')) return;
                await this.db.deleteBackup(id);
                await this.refreshBackupList();
                if (this.currentMode === 'backup') this.renderRightPanel();
            },

            downloadSnapshot(id) {
                const snap = this.backups.find(x => x.id === id);
                if (!snap) return;
                this.downloadFile(JSON.stringify(snap.data, null, 2), `单词本备份_${new Date(snap.createdAt).toISOString().slice(0,10)}.json`, 'application/json;charset=utf-8');
            },

            isDefinitionLikeCore(text, word) {
                const s = String(text || '').trim();
                if (!s) return true;
                if (s.length > 140) return true;
                if (/^(vt\.|vi\.|v\.|n\.|adj\.|adv\.|prep\.|conj\.|pron\.|num\.|art\.|aux\.|a\.|ad\.)\s*/i.test(s)) return true;
                if (/(中文近义|释义|意思是|翻译|英文|中文|词义|词性|词典|词典义)/.test(s)) return true;
                if (/^义[①②③④⑤⑥⑦⑧⑨⑩]/.test(s)) return true;
                if ((word.senses || []).some(x => String(x.definition || '').trim() === s)) return true;
                return false;
            },

            sanitizeCore(word) {
                if (!word.core || typeof word.core !== 'object' || Array.isArray(word.core)) word.core = {};
                const core = word.core;
                if (core.feeling && this.isDefinitionLikeCore(core.feeling, word)) {
                    core.legacyFeeling = core.feeling;
                    core.feeling = '';
                    core.quality = 'needs-review';
                } else if (core.feeling) {
                    core.quality = 'ok';
                } else {
                    core.quality = core.quality || 'missing';
                }
                return core;
            },

            migrateWord(w) {
                if (!w.definition && !w.example && w.aiText) {
                    const text = w.aiText;
                    const markers = ['例句：', '例句:', 'Example:', 'example:', '例如：', '例如:', '比如：', '比如:'];
                    let def = text,
                        ex = '';
                    for (const m of markers) {
                        const idx = text.indexOf(m);
                        if (idx !== -1) { def = text.substring(0, idx).trim();
                            ex = text.substring(idx + m.length).trim(); break; }
                    }
                    if (!ex && text.includes('\n')) {
                        const lines = text.split('\n').filter(l => l.trim());
                        if (lines.length >= 2) { def = lines[0].trim();
                            ex = lines.slice(1).join('\n').trim(); }
                    }
                    w.definition = def || text;
                    w.example = ex || '';
                    delete w.aiText;
                }
                if (!w.definition) w.definition = '';
                if (!w.example) w.example = '';
                if (!w.senses || !Array.isArray(w.senses) || w.senses.length === 0) {
                    const sense = { id: this.genId(), definition: w.definition || '', example: w.example || '',
                        tone: w.tone || '', topic: w.topic || '', pos: w.pos || '', level: w.level || '',
                        origin: w.origin || '', formality: w.formality || '', grammar: w.grammar || '',
                        synonyms: w.synonyms || '', collocations: w.collocations || '', pitfall: w.pitfall || '',
                        notes: (w.notes && Array.isArray(w.notes)) ? w.notes : (w.note ? [w.note] : ['']) };
                    w.senses = [sense];
                } else {
                    w.senses = w.senses.map(s => {
                        if (!s.id) s.id = this.genId();
                        if (!s.notes || !Array.isArray(s.notes)) s.notes = s.note ? [s.note] : [''];
                        delete s.note;
                        ['definition', 'example', 'tone', 'topic', 'pos', 'level', 'origin', 'formality', 'grammar',
                            'synonyms', 'collocations', 'pitfall'
                        ].forEach(f => { if (s[f] === undefined) s[f] = ''; });
                        return s;
                    });
                }
                if (!w.wordNotes || !Array.isArray(w.wordNotes)) {
                    if (w.wordNote) { w.wordNotes = [w.wordNote];
                        delete w.wordNote; } else if (w.notes && !w.senses[0].notes.length) { w.wordNotes = []; } else { w
                            .wordNotes = []; }
                }
                if (!w.phonetic) w.phonetic = '';
                if (!w.mastery) w.mastery = 'unknown';
                if (!w.addedDate) w.addedDate = Date.now();
                if (!w.lastReviewDate) w.lastReviewDate = Date.now() - 86400000 * 3;
                if (w.deleted === undefined) w.deleted = false;
                delete w.definition;
                delete w.example;
                delete w.tone;
                delete w.topic;
                delete w.pos;
                delete w.level;
                delete w.origin;
                delete w.formality;
                delete w.grammar;
                delete w.synonyms;
                delete w.collocations;
                delete w.pitfall;
                delete w.note;
                if (typeof w.reviewCount !== 'number' || !Number.isFinite(w.reviewCount)) w.reviewCount = 0;
                if (typeof w.correctCount !== 'number' || !Number.isFinite(w.correctCount)) w.correctCount = 0;
                this.sanitizeCore(w);
                return w;
            },

            buildIndex() {
                this.searchIndex.rebuild(this.words);
            },

            refreshWordIndex(wordId) {
                const w = this.words.find(x => x.id === wordId);
                if (w) this.searchIndex.addWord(w);
            },

            getDisplayWords() {
                let list = this.currentMode === 'recycle' ? this.words.filter(w => w.deleted === true) : this.words.filter(w =>
                    w.deleted !== true);
                if (this.currentMode !== 'recycle' && this.activeDeckId !== 'all') {
                    list = list.filter(w => this.deckWords.has(this.deckKey(this.activeDeckId, w.id)));
                }
                return list;
            },

            // 0.2 起：出题随机选义项，而不是永远只考 senses[0]
            pickSense(word, preferredId = null) {
                const senses = (word && Array.isArray(word.senses)) ? word.senses.filter(Boolean) : [];
                if (senses.length === 0) return null;
                if (preferredId !== null) {
                    const preferred = senses.find(s => s.id === preferredId);
                    if (preferred) return preferred;
                }
                if (senses.length === 1) return senses[0];
                return senses[Math.floor(Math.random() * senses.length)];
            },

            getSearchTokens() {
                const q = this.searchQuery.trim();
                if (!q) return [];
                return q.split(/\s+/)
                    .map(t => t.replace(/^[\s,.;:!?，。；：！？"'()\[\]{}<>]+|[\s,.;:!?，。；：！？"'()\[\]{}<>]+$/g, ''))
                    .filter(Boolean);
            },

            getFilteredWords() {
                let list = this.getDisplayWords();
                const query = this.searchQuery.trim();
                if (query) {
                    const ids = this.searchIndex.search(query);
                    if (ids) list = list.filter(w => ids.has(w.id));
                }
                return list.sort((a, b) => a.word.localeCompare(b.word));
            },

            updateSearchSummary(count) {
                const el = document.getElementById('searchSummary');
                if (!el) return;
                const query = this.searchQuery.trim();
                if (!query) {
                    el.classList.remove('show');
                    el.textContent = '';
                    return;
                }
                el.classList.add('show');
                el.innerHTML = `<span>🔍 搜索「${this.escapeHtml(query)}」：<b>${count}</b> 个结果</span><button type="button" id="summaryClearBtn">清除搜索</button>`;
                const btn = el.querySelector('#summaryClearBtn');
                if (btn) btn.addEventListener('click', () => this.clearSearch());
            },

            syncSelectionToFiltered(list) {
                if (!list.length) {
                    this.currentWordId = null;
                    this.currentSenseId = null;
                    return;
                }
                const current = list.find(w => w.id === this.currentWordId);
                if (current) {
                    if (this.currentSenseId && !current.senses.some(s => s.id === this.currentSenseId)) {
                        this.currentSenseId = null;
                    }
                    return;
                }
                this.currentWordId = list[0].id;
                this.currentSenseId = null;
            },

            clearSearch() {
                const input = document.getElementById('searchInput');
                if (input) input.value = '';
                this.searchQuery = '';
                const list = this.getFilteredWords();
                if (list.length > 0) {
                    this.currentWordId = list[0].id;
                    this.currentSenseId = null;
                }
                this.render();
            },

            showToast(message, type = 'info', duration = 2500, undoCallback = null) {
                const el = document.getElementById('toast');
                if (!el) return;
                el.textContent = String(message == null ? '' : message);
                el.className = 'toast';
                if (type === 'success') el.classList.add('success');
                else if (type === 'error') el.classList.add('error');
                else el.classList.add('info');
                if (undoCallback) {
                    const btn = document.createElement('button');
                    btn.className = 'undo-btn';
                    btn.textContent = '↩ 撤销';
                    btn.addEventListener('click', (e) => { e.stopPropagation();
                        undoCallback();
                        this.hideToast(); });
                    el.appendChild(btn);
                    duration = Math.max(duration, 4000);
                }
                void el.offsetWidth;
                el.classList.add('show');
                clearTimeout(this.toastTimer);
                this.toastTimer = setTimeout(() => this.hideToast(), duration);
            },
            hideToast() {
                const el = document.getElementById('toast');
                if (el) el.classList.remove('show');
                clearTimeout(this.toastTimer);
            },

            renderAlphaNav() {
                const nav = document.getElementById('alphaNav');
                const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
                nav.innerHTML = letters.map(l => `<button data-letter="${l}">${l}</button>`).join('');
                nav.addEventListener('click', (e) => {
                    const btn = e.target.closest('button[data-letter]');
                    if (btn) this.scrollToLetter(btn.dataset.letter);
                });
            },
            updateAlphaNav() {
                const nav = document.getElementById('alphaNav');
                const buttons = nav.querySelectorAll('button');
                const displayWords = this.getFilteredWords();
                const hasLetter = new Set();
                displayWords.forEach(w => { if (w.word) hasLetter.add(w.word.charAt(0).toUpperCase()); });
                buttons.forEach(btn => {
                    const letter = btn.dataset.letter;
                    btn.classList.toggle('disabled', !hasLetter.has(letter));
                });
            },
            scrollToLetter(letter) {
                if (this.currentGroupBy !== 'hierarchy' && this.currentGroupBy !== 'alphabetical') {
                    this.showToast('⚠️ 字母书签仅在层级列表和字母分组模式下可用', 'info');
                    return;
                }
                const container = document.getElementById('listContainer');
                const items = container.querySelectorAll('.list-item[data-word-id]');
                for (const item of items) {
                    const wordId = Number(item.dataset.wordId);
                    const word = this.words.find(w => w.id === wordId);
                    if (word && word.word && word.word.charAt(0).toUpperCase() === letter) {
                        item.scrollIntoView({ block: 'start', behavior: 'smooth' });
                        break;
                    }
                }
            },

            render() {
                this.renderList();
                this.renderRightPanel();
                this.updateSearchClearBtn();
                this.updateNavButtons();
                this.updateDeckSelect();
                this.updateGroupBySelect();
                this.updateAlphaNav();
            },
            updateNavButtons() {
                document.querySelectorAll('.top-bar .nav-btn').forEach(btn => {
                    if (btn.id === 'batchManageBtn') return;
                    btn.classList.toggle('active', btn.dataset.mode === this.currentMode);
                });
            },
            updateSearchClearBtn() {
                const btn = document.getElementById('clearSearchBtn');
                const input = document.getElementById('searchInput');
                btn.classList.toggle('show', input.value.trim().length > 0);
            },
            updateGroupBySelect() {
                const sel = document.getElementById('groupBySelect');
                if (sel.value !== this.currentGroupBy) sel.value = this.currentGroupBy;
            },

            renderList(filteredWordsInput = null) {
                const container = document.getElementById('listContainer');
                const query = this.searchQuery.trim();
                const isBatchMode = this.batchMode && (this.currentMode === 'dictionary' || this.currentMode === 'recycle');
                const filteredWords = filteredWordsInput ? [...filteredWordsInput] : this.getFilteredWords();
                this.updateSearchSummary(filteredWords.length);

                if (this.currentMode === 'recycle') {
                    if (filteredWords.length === 0) {
                        container.innerHTML = `<div class="empty-state">${query ? '🔍 回收站中没有匹配的条目' : '♻️ 回收站为空'}</div>`;
                        return;
                    }
                    let html = '';
                    filteredWords.forEach(w => {
                        const wordActive = (this.currentWordId === w.id && this.currentSenseId === null);
                        const rsSelected = isBatchMode && this.selectedWordIds.has(w.id);
                        html +=
                            `<div class="list-item word-item deleted-item ${wordActive ? 'active' : ''} ${rsSelected ? 'batch-selected' : ''}" data-word-id="${w.id}" data-sense-id="">
                            <div class="word-row">
                                ${isBatchMode ? `<input type="checkbox" class="batch-checkbox" data-word-id="${w.id}" ${rsSelected ? 'checked' : ''} />` : ''}
                                <span class="word-text"><strong>${this.escapeHtml(w.word)}</strong> <span style="color:#94a3b8;font-size:13px;">(已删除)</span></span>
                            </div>
                            ${!isBatchMode ? `<div class="recycle-actions"><button class="restore-btn" data-action="restore" data-word-id="${w.id}">↩ 还原</button><button class="permanent-delete-btn" data-action="permanent-delete" data-word-id="${w.id}">🗑 永久删除</button></div>` : ''}
                        </div>`;
                    });
                    container.innerHTML = html;
                    return;
                }

                if (this.currentGroupBy === 'hierarchy') {
                    if (filteredWords.length === 0) {
                        container.innerHTML =
                            `<div class="empty-state">${query ? '🔍 没有匹配的单词' : '还没有单词，添加一个吧！'}</div>`;
                        return;
                    }
                    let html = '';
                    filteredWords.forEach(w => {
                        const wordActive = (this.currentWordId === w.id && this.currentSenseId === null);
                        const badge = w.mastery === 'mastered' ? 'mastered' : (w.mastery === 'learning' ?
                            'learning' : '');
                        const needsReview = (Date.now() - w.lastReviewDate) / 86400000 > 2;
                        const hwSelected = isBatchMode && this.selectedWordIds.has(w.id);
                        html +=
                            `<div class="list-item word-item ${wordActive ? 'active' : ''} ${hwSelected ? 'batch-selected' : ''}" data-word-id="${w.id}" data-sense-id="">
                            <div class="word-row">
                                ${isBatchMode ? `<input type="checkbox" class="batch-checkbox" data-word-id="${w.id}" ${hwSelected ? 'checked' : ''} />` : ''}
                                <span class="word-text"><strong>${this.escapeHtml(w.word)}</strong></span>
                                ${badge ? `<span class="mastery-badge ${badge}">${w.mastery === 'mastered' ? '✅' : '🔄'}</span>` : ''}
                                ${needsReview ? `<span class="review-reminder">🔔</span>` : ''}
                            </div>
                        </div>`;
                        w.senses.forEach(s => {
                            const senseActive = (this.currentWordId === w.id && this.currentSenseId === s.id);
                            const hsSelected = isBatchMode && this.selectedWordIds.has(w.id);
                            html +=
                                `<div class="list-item sense-item ${senseActive ? 'active' : ''} ${hsSelected ? 'batch-selected' : ''}" data-word-id="${w.id}" data-sense-id="${s.id}">
                                    <div class="word-row"><span class="word-text">↳ ${this.escapeHtml(s.definition || '（释义）')}</span></div>
                                </div>`;
                        });
                    });
                    container.innerHTML = html;
                    return;
                }

                let groups = [];
                if (this.currentGroupBy === 'alphabetical') {
                    const letterMap = {};
                    filteredWords.forEach(w => {
                        const letter = w.word.charAt(0).toUpperCase() || '#';
                        if (!letterMap[letter]) letterMap[letter] = [];
                        letterMap[letter].push(w);
                    });
                    groups = Object.keys(letterMap).sort().map(letter => ({
                        title: letter,
                        items: letterMap[letter].map(w => ({ type: 'word', word: w, sense: null, label: w
                                .word }))
                    }));
                } else {
                    const field = this.currentGroupBy;
                    const senseMap = {};
                    filteredWords.forEach(w => {
                        w.senses.forEach(s => {
                            const val = (s[field] && s[field].trim()) ? s[field].trim() : '未标记';
                            if (!senseMap[val]) senseMap[val] = [];
                            senseMap[val].push({ word: w, sense: s, label: w.word + ': ' + (s
                                    .definition ? s.definition.slice(0, 40) : '') });
                        });
                    });
                    const sortedKeys = Object.keys(senseMap).sort((a, b) => a.localeCompare(b));
                    groups = sortedKeys.map(key => ({ title: key, items: senseMap[key] }));
                }

                if (groups.length === 0 || groups.every(g => g.items.length === 0)) {
                    container.innerHTML = `<div class="empty-state">${query ? '🔍 没有匹配的条目' : '还没有单词，添加一个吧！'}</div>`;
                    return;
                }
                let html = '';
                groups.forEach(group => {
                    if (group.items.length === 0) return;
                    html +=
                        `<div class="list-group"><div class="group-title"><span>${this.escapeHtml(group.title)}</span><span class="count">${group.items.length}</span></div>`;
                    group.items.forEach(item => {
                        const isActive = (item.type === 'word' && this.currentWordId === item.word.id &&
                            this.currentSenseId === null) || (item.type === 'sense' && this
                            .currentSenseId === item.sense.id);
                        const activeClass = isActive ? 'active' : '';
                        const badge = item.word.mastery === 'mastered' ? 'mastered' : (item.word.mastery ===
                            'learning' ? 'learning' : '');
                        const needsReview = (Date.now() - item.word.lastReviewDate) / 86400000 > 2;
                        const giSelected = isBatchMode && this.selectedWordIds.has(item.word.id);
                        html +=
                            `<div class="list-item ${activeClass} ${giSelected ? 'batch-selected' : ''}" data-word-id="${item.word.id}" data-sense-id="${item.sense ? item.sense.id : ''}">
                                <div class="word-row">
                                    ${isBatchMode ? `<input type="checkbox" class="batch-checkbox" data-word-id="${item.word.id}" ${giSelected ? 'checked' : ''} />` : ''}
                                    <span class="word-text">${this.escapeHtml(item.label)}</span>
                                    ${badge ? `<span class="mastery-badge ${badge}">${item.word.mastery === 'mastered' ? '✅' : '🔄'}</span>` : ''}
                                    ${needsReview ? `<span class="review-reminder">🔔</span>` : ''}
                                </div>
                            </div>`;
                    });
                    html += '</div>';
                });
                container.innerHTML = html;
            },

            bindListEvents() {
                const container = document.getElementById('listContainer');
                container.addEventListener('click', (e) => {
                    const item = e.target.closest('.list-item');
                    if (!item) return;
                    const wordId = Number(item.dataset.wordId);
                    const senseId = item.dataset.senseId ? Number(item.dataset.senseId) : null;

                    const recycleBtn = e.target.closest('.restore-btn, .permanent-delete-btn');
                    if (recycleBtn && !this.batchMode) {
                        e.stopPropagation();
                        const action = recycleBtn.dataset.action;
                        const id = Number(recycleBtn.dataset.wordId);
                        if (action === 'restore') this.restoreWord(id);
                        else if (action === 'permanent-delete') {
                            if (confirm('永久删除该单词及其所有释义，不可恢复，确定吗？')) this.permanentDeleteWord(id);
                        }
                        return;
                    }

                    const cb = e.target.closest('.batch-checkbox');
                    if (cb && this.batchMode) {
                        e.stopPropagation();
                        const id = Number(cb.dataset.wordId);
                        if (cb.checked) this.selectedWordIds.add(id);
                        else this.selectedWordIds.delete(id);
                        item.classList.toggle('batch-selected', this.selectedWordIds.has(id));
                        this.updateBatchInfo();
                        return;
                    }

                    if (this.batchMode) {
                        const checkbox = item.querySelector('.batch-checkbox');
                        if (checkbox) {
                            checkbox.checked = !checkbox.checked;
                            if (checkbox.checked) this.selectedWordIds.add(wordId);
                            else this.selectedWordIds.delete(wordId);
                            item.classList.toggle('batch-selected', this.selectedWordIds.has(wordId));
                            this.updateBatchInfo();
                            return;
                        }
                    }

                    if (this.currentMode !== 'dictionary' && this.currentMode !== 'recycle') {
                        this.currentMode = 'dictionary';
                        this.render();
                    }
                    this.selectEntry(wordId, senseId);
                });
            },

            selectEntry(wordId, senseId) {
                const word = this.words.find(w => w.id === wordId);
                if (!word) return;
                this.currentWordId = wordId;
                if (senseId && word.senses.some(s => s.id === senseId)) this.currentSenseId = senseId;
                else this.currentSenseId = null;
                this.renderRightPanel();
                document.querySelectorAll('.list-item').forEach(el => {
                    const wid = Number(el.dataset.wordId);
                    const sid = el.dataset.senseId ? Number(el.dataset.senseId) : null;
                    el.classList.toggle('active', wid === this.currentWordId && sid === this.currentSenseId);
                });
            },

            stopGameTimers() {
                this.cancelPendingNext();
                Object.values(this.gameStates || {}).forEach(state => {
                    if (!state) return;
                    if (state.timerId) {
                        clearInterval(state.timerId);
                        state.timerId = null;
                    }
                    if (state.pendingTimeout) {
                        clearTimeout(state.pendingTimeout);
                        state.pendingTimeout = null;
                    }
                });
            },

            isGameActive(gameId) {
                return this.currentMode === 'review' && this.currentGame === gameId;
            },

            leaveGame() {
                this.stopGameTimers();
                this.flushReview();
                this.currentGame = null;
                this.renderRightPanel();
                this.renderList();
            },

            renderRightPanel() {
                const panel = document.getElementById('rightPanel');
                if (this.currentMode !== 'review' || !this.currentGame) this.stopGameTimers();
                if (this.currentMode === 'daily') {
                    this.renderDailyQueue(panel);
                    return;
                }
                if (this.currentMode === 'dailyReview') {
                    this.renderDailyReview(panel);
                    return;
                }
                if (this.currentMode === 'backup') {
                    this.renderBackupPage(panel);
                    return;
                }
                if (this.currentMode === 'decks') {
                    this.renderDeckManager(panel);
                    return;
                }
                if (this.currentMode === 'settings') {
                    this.renderSettings(panel);
                    return;
                }
                if (this.currentMode === 'review') {
                    this.renderReviewCenter(panel);
                    return;
                }
                if (this.currentMode === 'dictionary' || this.currentMode === 'recycle') {
                    this.renderDictionaryDetail(panel);
                } else if (this.currentMode === 'stats') {
                    this.renderStats(panel);
                } else {
                    panel.innerHTML = '<div class="detail-placeholder">👆 点击左侧条目查看详情</div>';
                }
            },

            isProgressActive(p) {
                if (!p) return false;
                const w = this.words.find(x => x.id === p.wordId && !x.deleted);
                return !!(w && (w.senses || []).some(s => s && s.id === p.senseId));
            },

            getWrongItems() {
                const out = [];
                for (const p of this.progress.values()) {
                    if (!p || !p.wrongActive || !this.isProgressActive(p)) continue;
                    const w = this.words.find(x => x.id === p.wordId && !x.deleted && this.wordInActiveDeck(x));
                    const s = w && (w.senses || []).find(x => x && x.id === p.senseId);
                    if (w && s) out.push({ wordId: w.id, senseId: s.id, word: w, sense: s, progress: p, type: 'wrong' });
                }
                return out.sort((a, b) => (a.progress.lastReviewedAt || 0) - (b.progress.lastReviewedAt || 0));
            },

            getDailyStats() {
                const now = Date.now();
                let due = 0;
                let freshWords = 0;
                let freshSenses = 0;
                for (const w of this.words) {
                    if (w.deleted || !this.wordInActiveDeck(w)) continue;
                    let hasFresh = false;
                    for (const s of (w.senses || [])) {
                        if (!s || !s.definition) continue;
                        const p = this.progress.get(this.senseKey(w.id, s.id));
                        if (!p) { freshSenses++; hasFresh = true; }
                        else if (p.dueAt <= now) due++;
                    }
                    if (hasFresh) freshWords++;
                }
                return { due, freshWords, freshSenses, wrong: this.getWrongItems().length };
            },

            buildDailyQueue() {
                const now = Date.now();
                const due = [];
                const fresh = [];
                for (const w of this.words) {
                    if (w.deleted || !this.wordInActiveDeck(w)) continue;
                    let pickedFresh = false;
                    (w.senses || []).forEach(s => {
                        if (!s || !s.definition) return;
                        const p = this.progress.get(this.senseKey(w.id, s.id));
                        if (!p) {
                            // 新词每天只引入一个义项，避免同一个词一次塞四个新义项
                            if (!pickedFresh) {
                                fresh.push({ wordId: w.id, senseId: s.id, word: w, sense: s, progress: null, type: 'new' });
                                pickedFresh = true;
                            }
                        } else if (p.dueAt <= now) {
                            due.push({ wordId: w.id, senseId: s.id, word: w, sense: s, progress: p, type: 'due' });
                        }
                    });
                }
                due.sort((a, b) => (a.progress.dueAt || 0) - (b.progress.dueAt || 0));
                fresh.sort((a, b) => (a.word.addedDate || 0) - (b.word.addedDate || 0));
                const newLimit = Math.max(0, Math.min(200, Number(this.dailyLimits.newLimit) || 0));
                const dueLimit = Math.max(0, Math.min(500, Number(this.dailyLimits.dueLimit) || 0));
                return [...due.slice(0, dueLimit), ...fresh.slice(0, newLimit)];
            },

            buildWrongQueue() {
                return this.getWrongItems();
            },

            renderDailyQueue(container) {
                const stats = this.getDailyStats();
                const queue = this.buildDailyQueue();
                const wrongItems = this.getWrongItems();
                const preview = queue.slice(0, 8);
                const wrongPreview = wrongItems.slice(0, 6);
                const previewHtml = preview.length ? preview.map(item => {
                    const def = (item.sense.definition || '').slice(0, 52);
                    const tag = item.type === 'due' ? '到期' : '新词';
                    return `<div class="daily-item"><span class="daily-tag ${item.type}">${tag}</span><b>${this.escapeHtml(item.word.word)}</b><span>${this.escapeHtml(def)}${item.sense.definition && item.sense.definition.length > 52 ? '…' : ''}</span></div>`;
                }).join('') : '<div class="daily-empty">今天没有到期任务，可以自由复习或导入新词。</div>';
                const wrongHtml = wrongPreview.length ? wrongPreview.map(item => {
                    const def = (item.sense.definition || '').slice(0, 48);
                    return `<div class="daily-item wrong"><b>${this.escapeHtml(item.word.word)}</b><span>${this.escapeHtml(def)}</span><button class="daily-remove-wrong" data-key="${this.escapeHtml(item.progress.key)}">移出</button></div>`;
                }).join('') : '<div class="daily-empty">错题本是空的。答错的义项会自动进来。</div>';
                container.innerHTML = `
                    <div class="daily-page">
                        <div class="daily-hero">
                            <div>
                                <div class="daily-title">📅 今日任务</div>
                                <div class="daily-sub">按义项安排：到期优先，新词每天最多 ${this.dailyLimits.newLimit} 个义项。</div>
                            </div>
                            <button class="back-btn" id="dailyRefreshBtn">🔄 刷新</button>
                        </div>
                        <div class="daily-stats">
                            <div class="daily-stat"><div class="num">${stats.due}</div><div class="lbl">⏰ 到期义项</div></div>
                            <div class="daily-stat"><div class="num">${stats.freshWords}</div><div class="lbl">🆕 新词</div></div>
                            <div class="daily-stat"><div class="num">${stats.wrong}</div><div class="lbl">❗ 错题</div></div>
                        </div>
                        <div class="daily-controls">
                            <label>新词上限 <input id="dailyNewLimit" type="number" min="0" max="200" value="${this.dailyLimits.newLimit}"></label>
                            <label>到期上限 <input id="dailyDueLimit" type="number" min="0" max="500" value="${this.dailyLimits.dueLimit}"></label>
                            <span class="daily-queue-count">本次队列 ${queue.length} 个义项</span>
                        </div>
                        <div class="daily-actions">
                            <button class="daily-start" id="dailyStartBtn" ${queue.length ? '' : 'disabled'}>▶ 开始今日复习</button>
                            <button class="daily-wrong-start" id="wrongStartBtn" ${wrongItems.length ? '' : 'disabled'}>❗ 复习错题（${wrongItems.length}）</button>
                        </div>
                        <div class="daily-section-title">今日队列预览</div>
                        <div class="daily-list">${previewHtml}</div>
                        <div class="daily-section-title">错题本</div>
                        <div class="daily-list">${wrongHtml}</div>
                    </div>
                `;
                const refresh = document.getElementById('dailyRefreshBtn');
                if (refresh) refresh.addEventListener('click', () => this.renderDailyQueue(container));
                const newInput = document.getElementById('dailyNewLimit');
                const dueInput = document.getElementById('dailyDueLimit');
                const applyLimits = () => {
                    this.dailyLimits.newLimit = Math.max(0, Math.min(200, Number(newInput.value) || 0));
                    this.dailyLimits.dueLimit = Math.max(0, Math.min(500, Number(dueInput.value) || 0));
                    this.renderDailyQueue(container);
                };
                if (newInput) newInput.addEventListener('change', applyLimits);
                if (dueInput) dueInput.addEventListener('change', applyLimits);
                const start = document.getElementById('dailyStartBtn');
                if (start) start.addEventListener('click', () => this.startDailyReview('daily'));
                const wrongStart = document.getElementById('wrongStartBtn');
                if (wrongStart) wrongStart.addEventListener('click', () => this.startDailyReview('wrong'));
                container.querySelectorAll('.daily-remove-wrong').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const p = this.progress.get(btn.dataset.key);
                        if (p) {
                            p.wrongActive = false;
                            p.consecutiveCorrect = 0;
                            this.saveData(true);
                            this.renderDailyQueue(container);
                        }
                    });
                });
            },

            startDailyReview(kind = 'daily') {
                const queue = kind === 'wrong' ? this.buildWrongQueue() : this.buildDailyQueue();
                if (!queue.length) {
                    this.showToast(kind === 'wrong' ? '错题本是空的' : '今天没有到期任务', 'info');
                    return;
                }
                this.stopGameTimers();
                this.flushReview();
                this.dailySession = {
                    queue, index: 0, kind, correct: 0, revealed: false, total: queue.length
                };
                this.currentMode = 'dailyReview';
                this.currentGame = null;
                this.render();
            },

            renderDailyReview(panel) {
                const s = this.dailySession;
                if (!s) { this.renderDailyQueue(panel); return; }
                if (s.index >= s.total) {
                    const acc = s.total ? Math.round(s.correct / s.total * 100) : 0;
                    if (!s.finishedAt) s.finishedAt = Date.now();
                    this.flushReview();
                    panel.innerHTML = `
                        <div class="game-container daily-review-result">
                            <div class="game-header">
                                <div class="game-title">${s.kind === 'wrong' ? '❗ 错题复习' : '📅 今日复习'} <small>完成</small></div>
                                <button class="back-btn" id="dailyResultBack">← 返回今日任务</button>
                            </div>
                            <div class="game-result">
                                <div class="big-score">${s.correct} / ${s.total}</div>
                                <div class="sub">记得 ${s.correct} 个 · 正确率 ${acc}%</div>
                                <button id="dailyResultAgain">🔄 再复习一轮</button>
                            </div>
                        </div>
                    `;
                    const back = document.getElementById('dailyResultBack');
                    if (back) back.addEventListener('click', () => {
                        this.currentMode = 'daily';
                        this.dailySession = null;
                        this.render();
                    });
                    const again = document.getElementById('dailyResultAgain');
                    if (again) again.addEventListener('click', () => {
                        const kind = s.kind;
                        this.dailySession = null;
                        this.startDailyReview(kind);
                    });
                    return;
                }
                const item = s.queue[s.index];
                const w = this.words.find(x => x.id === item.wordId && !x.deleted);
                const sense = w && (w.senses || []).find(x => x && x.id === item.senseId);
                if (!w || !sense) {
                    s.index++;
                    this.renderDailyReview(panel);
                    return;
                }
                const typeLabel = s.kind === 'wrong' ? '错题' : (item.type === 'due' ? '到期义项' : '新词');
                const body = !s.revealed ? `
                    <div class="daily-review-prompt">先在心里回忆这个词的义项，再揭示答案。</div>
                    <div class="daily-review-reveal-wrap"><button id="dailyRevealBtn">👀 显示义项</button></div>
                ` : `
                    <div class="daily-review-answer">
                        <div class="daily-review-def">${this.escapeHtml(sense.definition || '（无释义）')}</div>
                        ${sense.coreLink ? `<div class="daily-review-core">🧭 ${this.escapeHtml(sense.coreLink)}</div>` : ''}
                        ${sense.example ? `<div class="daily-review-example">📝 ${this.escapeHtml(sense.example)}</div>` : ''}
                        ${sense.notes && sense.notes[0] ? `<div class="daily-review-note">✏️ ${this.escapeHtml(sense.notes[0])}</div>` : ''}
                    </div>
                    <div class="daily-review-actions">
                        <button data-grade="0" class="grade-forgot">😵 忘记</button>
                        <button data-grade="1" class="grade-fuzzy">🤔 模糊</button>
                        <button data-grade="2" class="grade-remember">✅ 记得</button>
                    </div>
                `;
                panel.innerHTML = `
                    <div class="game-container daily-review">
                        <div class="game-header">
                            <div class="game-title">${s.kind === 'wrong' ? '❗ 错题复习' : '📅 今日复习'} <small>${typeLabel}</small></div>
                            <button class="back-btn" id="dailyReviewBack">← 返回今日任务</button>
                        </div>
                        <div class="daily-review-word">${this.escapeHtml(w.word)}</div>
                        ${w.phonetic ? `<div class="daily-review-phonetic">${this.escapeHtml(w.phonetic)}</div>` : ''}
                        ${body}
                        <div class="daily-review-status">
                            <span>进度 ${s.index + 1} / ${s.total}</span>
                            <span>记得 ${s.correct}</span>
                        </div>
                    </div>
                `;
                const back = document.getElementById('dailyReviewBack');
                if (back) back.addEventListener('click', () => {
                    this.flushReview();
                    this.currentMode = 'daily';
                    this.dailySession = null;
                    this.render();
                });
                const dailyEl = panel.querySelector('.daily-review');
                if (dailyEl && !s.revealed) dailyEl.addEventListener('click', (e) => {
                    if (e.target && e.target.closest && e.target.closest('button')) return;
                    s.revealed = true;
                    this.renderDailyReview(panel);
                });
                const reveal = document.getElementById('dailyRevealBtn');
                if (reveal) reveal.addEventListener('click', () => {
                    s.revealed = true;
                    this.renderDailyReview(panel);
                });
                panel.querySelectorAll('.daily-review-actions button[data-grade]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const grade = Number(btn.dataset.grade);
                        this.recordReview(w.id, grade === 2, sense.id, grade);
                        if (grade === 2) s.correct++;
                        s.index++;
                        s.revealed = false;
                        this.renderDailyReview(panel);
                    });
                });
            },

            renderBackupPage(container) {
                if (!this._backupLoaded) {
                    this._backupLoaded = true;
                    this.refreshBackupList().then(() => {
                        if (this.currentMode === 'backup') this.renderBackupPage(container);
                    });
                }
                const fmt = (ms) => new Date(ms).toLocaleString('zh-CN');
                const fileList = window.desktop && this.fileBackups.length ? this.fileBackups : [];
                const snapshotCards = this.backups.length ? this.backups.map(s => `
                    <div class="backup-card">
                        <div class="backup-card-main">
                            <div class="backup-date">${this.escapeHtml(fmt(s.createdAt))}</div>
                            <div class="backup-meta">${s.wordCount || 0} 个单词 · ${s.progressCount || 0} 个义项进度 · ${this.escapeHtml(s.reason || 'manual')}</div>
                        </div>
                        <div class="backup-card-actions">
                            <button class="backup-restore" data-id="${this.escapeHtml(s.id)}">恢复</button>
                            <button class="backup-download" data-id="${this.escapeHtml(s.id)}">下载</button>
                            <button class="backup-delete" data-id="${this.escapeHtml(s.id)}">删除</button>
                        </div>
                    </div>
                `).join('') : '<div class="backup-empty">还没有内部备份。点「立即备份」创建第一份。</div>';
                const desktopCards = fileList.length ? fileList.map(f => `
                    <div class="backup-card">
                        <div class="backup-card-main">
                            <div class="backup-date">${this.escapeHtml(f.name)}</div>
                            <div class="backup-meta">${f.size ? Math.round(f.size / 1024) + ' KB' : ''} ${f.mtime ? '· ' + this.escapeHtml(fmt(f.mtime)) : ''}</div>
                        </div>
                        <div class="backup-card-actions">
                            <button class="backup-file-restore" data-name="${this.escapeHtml(f.name)}">恢复</button>
                        </div>
                    </div>
                `).join('') : '<div class="backup-empty">桌面版会自动把备份写到本地备份目录。</div>';
                const last = this.backups[0];
                container.innerHTML = `
                    <div class="backup-page">
                        <div class="backup-hero">
                            <div>
                                <div class="backup-title">🗄️ 备份与恢复</div>
                                <div class="backup-sub">启动时超过 12 小时自动备份，保留最近 7 份。恢复前会先自动备份当前数据。</div>
                            </div>
                            <div class="backup-hero-actions">
                                <button class="backup-primary" id="backupNowBtn">💾 立即备份</button>
                                <button class="backup-secondary" id="backupRefreshBtn">🔄 刷新</button>
                            </div>
                        </div>
                        <div class="backup-status">
                            <span>最近备份：${last ? this.escapeHtml(fmt(last.createdAt)) : '暂无'}</span>
                            <span>内部备份：${this.backups.length} 份</span>
                            <span>桌面文件：${fileList.length} 份</span>
                        </div>
                        <div class="backup-section-title">内部备份（IndexedDB）</div>
                        <div class="backup-list">${snapshotCards}</div>
                        <div class="backup-section-title">从文件恢复</div>
                        <div class="backup-file-actions">
                            <button class="backup-secondary" id="backupImportBtn">📂 选择备份 JSON</button>
                            <input type="file" id="backupFileInput" accept=".json,application/json" style="display:none;">
                            <span class="backup-hint">也可以继续用「导出 → JSON」手动保存。</span>
                        </div>
                        <div class="backup-section-title">桌面本地备份</div>
                        <div class="backup-list">${desktopCards}</div>
                        <div class="backup-folder-row">
                            <button class="backup-secondary" id="backupFolderBtn" ${window.desktop ? '' : 'disabled'}>📁 打开备份目录</button>
                            ${window.desktop ? '' : '<span class="backup-hint">网页版没有本地文件夹；桌面版可用。</span>'}
                        </div>
                    </div>
                `;
                const now = document.getElementById('backupNowBtn');
                if (now) now.addEventListener('click', async () => {
                    await this.createBackup('manual');
                    this._backupLoaded = false;
                    this.renderRightPanel();
                });
                const refresh = document.getElementById('backupRefreshBtn');
                if (refresh) refresh.addEventListener('click', async () => {
                    await this.refreshBackupList();
                    this.renderRightPanel();
                });
                const importBtn = document.getElementById('backupImportBtn');
                const importInput = document.getElementById('backupFileInput');
                if (importBtn && importInput) importBtn.addEventListener('click', () => importInput.click());
                if (importInput) importInput.addEventListener('change', async () => {
                    const file = importInput.files && importInput.files[0];
                    if (!file) return;
                    try {
                        const text = await this.readFileText(file);
                        const data = JSON.parse(text);
                        if (!confirm(`将从「${file.name}」恢复，覆盖当前数据。\n恢复前会自动备份当前数据。确定继续吗？`)) return;
                        await this.restoreFromData(data, '文件备份');
                        this._backupLoaded = false;
                        this.renderRightPanel();
                    } catch (e) {
                        this.showToast('读取备份失败：' + e.message, 'error');
                    }
                });
                container.querySelectorAll('.backup-restore').forEach(btn => {
                    btn.addEventListener('click', () => this.restoreSnapshot(btn.dataset.id));
                });
                container.querySelectorAll('.backup-download').forEach(btn => {
                    btn.addEventListener('click', () => this.downloadSnapshot(btn.dataset.id));
                });
                container.querySelectorAll('.backup-delete').forEach(btn => {
                    btn.addEventListener('click', () => this.deleteSnapshot(btn.dataset.id));
                });
                container.querySelectorAll('.backup-file-restore').forEach(btn => {
                    btn.addEventListener('click', () => this.restoreDesktopFile(btn.dataset.name));
                });
                const folder = document.getElementById('backupFolderBtn');
                if (folder) folder.addEventListener('click', async () => {
                    if (window.desktop && typeof window.desktop.openBackupFolder === 'function') {
                        await window.desktop.openBackupFolder();
                    }
                });
            },

            renderReviewCenter(container) {
                if (!this.currentGame || !this.games[this.currentGame]) {
                    this.renderGameSelector(container);
                    return;
                }
                const game = this.games[this.currentGame];
                if (game && typeof game.render === 'function') {
                    game.render.call(this, container);
                } else {
                    container.innerHTML = '<div class="detail-placeholder">⚠️ 游戏加载失败</div>';
                }
            },

            renderGameSelector(container) {
                const gameList = Object.values(this.games);
                if (gameList.length === 0) {
                    container.innerHTML = '<div class="detail-placeholder">暂无游戏</div>';
                    return;
                }
                const dailyStats = this.getDailyStats();
                let html = `
                    <div style="padding: 8px 0;">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
                            <h2 style="font-size:24px;font-weight:700;">🎮 选择复习游戏</h2>
                            <span style="font-size:14px;color:#64748b;">${this.words.filter(w=>!w.deleted).length} 个活跃单词</span>
                        </div>
                        <div class="daily-banner" id="dailyBanner">
                            <div>
                                <b>📅 今日任务</b>
                                <span>到期 ${dailyStats.due} · 新词 ${dailyStats.freshWords} · 错题 ${dailyStats.wrong}</span>
                            </div>
                            <button>进入</button>
                        </div>
                        <div class="game-selector">
                `;
                for (const g of gameList) {
                    html += `
                        <div class="game-card" data-game="${g.id}">
                            <span class="game-icon">${g.icon}</span>
                            <div class="game-name">${g.name}</div>
                            <div class="game-desc">${g.desc}</div>
                            <span class="game-badge">${g.badge || '游戏'}</span>
                        </div>
                    `;
                }
                html += `</div></div>`;
                container.innerHTML = html;
                const dailyBanner = document.getElementById('dailyBanner');
                if (dailyBanner) dailyBanner.addEventListener('click', () => this.setMode('daily'));

                container.querySelectorAll('.game-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const gameId = card.dataset.game;
                        if (this.games[gameId]) {
                            this.stopGameTimers();
                            this.flushReview();
                            this.currentGame = gameId;
                            if (gameId === 'flashcard') {
                                this.flashcardIndex = 0;
                                this.flashcardFlipped = false;
                                this.flashcardSenseId = null;
                            } else {
                                this.gameStates[gameId] = {};
                            }
                            this.renderRightPanel();
                        }
                    });
                });
            },

            // ============================================================
            //  翻卡牌 (原有)
            // ============================================================
            renderFlashcardGame() {
                const container = document.getElementById('rightPanel');
                const activeWords = this.words.filter(w => !w.deleted);
                if (activeWords.length === 0) {
                    container.innerHTML =
                        `<div class="game-container"><div class="empty-review">🎉 没有可复习的单词</div></div>`;
                    return;
                }
                if (this.flashcardIndex >= activeWords.length) this.flashcardIndex = 0;
                const word = activeWords[this.flashcardIndex];
                if (!word) { this.flashcardIndex = 0;
                    this.renderFlashcardGame(); return; }
                const sense = this.pickSense(word, this.flashcardSenseId);
                if (!sense) { this.flashcardIndex = (this.flashcardIndex + 1) % activeWords.length;
                    this.flashcardSenseId = null;
                    this.renderFlashcardGame(); return; }
                this.flashcardSenseId = sense.id;
                const senseIndex = word.senses.findIndex(s => s.id === sense.id) + 1;
                const total = activeWords.length;
                const progress = `${this.flashcardIndex + 1} / ${total}`;

                let html = `
                    <div class="game-container flashcard-game">
                        <div class="game-header">
